x-coverage:
  state: gated
  reason: auth_required
  detail: 'The University of Washington genuinely operates its own API estate — six UW-IT Enterprise Web
    Services with institution-authored OpenAPI descriptions on University of Washington registrable domains.
    What is NOT open is the data. Specifications and Swagger UIs return 200 unauthenticated, but every
    SWS/IdCardWS data resource 302s to UW NetID sign-in through Microsoft Entra ID, DSpace REST item retrieval
    returns 401, and the IRWS and TAWS runtimes do not answer from the public internet at all. Two surfaces
    ARE open and were verified live: the ResearchWorks OAI-PMH 2.0 endpoint and the signed Shibboleth
    / InCommon SAML metadata document. No open-data portal exists (data.uw.edu and data.washington.edu
    do not resolve) and no self-service developer programme was found — access is institutional, requested
    through UW-IT, and authorised by named ASTRA roles. The 26 per-resource SWS/IdCardWS entries in apis[]
    are OUR refine step''s split of TWO institution contracts, not 26 independent APIs; x-service groups
    them. Removed 22 pointers to wiki.cac.washington.edu: the whole host times out on connect (curl 28),
    so the SWS Confluence space UW''s own registry links to is dead.'
