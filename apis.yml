---
aid: university-of-washington
name: University of Washington
description: >-
  The University of Washington (UW) is a public research university based in
  Seattle, Washington, United States, ranked #52 in the QS World University
  Rankings 2025. UW operates a mature, institutionally documented developer
  footprint through its UW-IT Enterprise Web Services (EWS) program, which
  exposes a registry of REST/SOAP web services for student, identity, person,
  group, and ID-card data, each with public Swagger/OpenAPI documentation.
  Most production data endpoints require an institutional UW NetID,
  certificate-based authentication, and approved access; the documentation,
  service registry, and Swagger specifications are publicly browsable. UW also
  publishes open scholarly metadata through its ResearchWorks DSpace repository
  (REST API and OAI-PMH) and maintains active public GitHub organizations.
