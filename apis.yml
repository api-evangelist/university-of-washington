- aid: university-of-washington:researchworks-dspace
  name: ResearchWorks Repository (DSpace REST + OAI-PMH)
  description: ResearchWorks is UW Libraries' institutional repository, running DSpace 9.2 on UW's own
    host. The DSpace REST root document is public (HTTP 200) and item retrieval is gated (HTTP 401), but
    the OAI-PMH 2.0 endpoint is fully open and serves ten metadata formats — oai_dc, qdc, mods, mets,
    didl, ore, xoai, dim, rioxx and uketd_dc — across departmental sets.
  humanURL: https://digital.lib.washington.edu/researchworks/
  baseURL: https://digital.lib.washington.edu/server/api
  tags:
  - Library
