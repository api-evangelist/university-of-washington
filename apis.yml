---
aid: university-of-washington
name: University of Washington
description: 'The University of Washington (UW) is a public research university in Seattle, Washington,
  United States, and one of the few higher-education institutions in this catalog that genuinely engineers
  and operates its own API estate rather than only buying one. UW-IT''s Enterprise Web Services (EWS)
  programme publishes a browsable service registry and institution-authored OpenAPI descriptions for the
  Student Web Service (SWS v5), the IdCard Web Service (IdCardWS v1), the Groups Web Service (GWS 2.3.x
  at groups.uw.edu), the Identity Registration Web Service (IRWS v2 and v3) and the Token Authentication
  Web Service (TAWS v2) — every one of them hosted on a University of Washington registrable domain, so
  the operator is the institution and not a platform vendor. The honest limit matters as much as the footprint:
  the specifications and Swagger UIs are public, but essentially every data resource behind them is gated
  by UW NetID (Microsoft Entra ID OIDC), an X.509 InCommon client certificate and named ASTRA authorisation
  roles, and the IRWS and TAWS runtimes are not reachable from the public internet at all. UW additionally
  operates two open, unauthenticated machine-readable surfaces of real value — an OAI-PMH 2.0 endpoint
  over the ResearchWorks DSpace 9.2 repository, and a signed SAML 2.0 / Shibboleth identity-provider metadata
  document registered in InCommon as urn:mace:incommon:washington.edu. No central open-data portal (data.uw.edu
  / data.washington.edu do not resolve) and no free public developer programme were found.'
