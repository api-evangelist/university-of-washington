          description: "Actual number of records on the current search results page. This must be set by the view in order\r\
            \nfor paging to work."
          nullable: true
        previousPageStart:
          type: string
          description: The counter value for the start of the previous search results page.
          nullable: true
          readOnly: true
        pageSize:
          type: string
          description: Requested number of records for the current search results page.
          nullable: true
        pageStart:
          type: string
          description: The counter value for the start of the current search results page.
          nullable: true
        nextPageStart:
          type: string
          description: The counter value for the start of the next search results page.
          nullable: true
          readOnly: true
        totalCount:
          type: integer
          format: int32
        pageStartOffset:
          type: integer
          description: "The page start offset. Since sources are generally 0 based and the view\r\ndefaults to 1 based, our\
            \ offset defaults to -1."
          format: int32
        format:
          $ref: '#/components/schemas/ViewFormats'
        regID:
          type: string
          nullable: true
          readOnly: true
      additionalProperties: false
    CardSearchViewModel:
