openapi: 3.0.1
info:
  title: IdCard Web Service (IdCardWS)
  description: IdCard Web Service (IdCardWS) provides a RESTful API to UW IdCard data. Subscribe to http://mailman.u.washington.edu/mailman/listinfo/idcardws-users
    to get notifications about planned outages, support and the announcement of new features.
  contact:
    name: Enterprise Web Services & Events Team
    url: https://itconnect.uw.edu/service/enterprise-web-services-and-events/
    email: idcardws-support@uw.edu
  version: v1
servers:
- url: /idcard
paths:
  /v1/card:
    get:
      tags:
      - Card
      operationId: GetCards
      parameters:
      - name: mag_strip_code
        in: query
        schema:
          type: string
          default: ''
      - name: prox_rfid
        in: query
        schema:
          type: string
          default: ''
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/CardSearchViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/CardSearchViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/CardSearchViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/CardSearchViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/CardSearchViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/CardSearchViewModel'
        '301':
          description: Moved Permanently
        '400':
          description: Bad Request
        '403':
          description: Forbidden
        '410':
          description: Gone
        '202':
          description: Accepted
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v1/photo/{reg_Id}:
    get:
      tags:
      - Photo
      summary: Get the Id card photo (image/jpeg) for the indicated person.
      operationId: Photo
      parameters:
      - name: reg_Id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v1/photo/{reg_Id}.{file_extension}:
    get:
      tags:
      - Photo
      summary: Get the Id card photo (image/jpeg) for the indicated person.
      operationId: PhotoWithExtension
      parameters:
      - name: reg_Id
        in: path
        required: true
        schema:
          type: string
      - name: file_extension
        in: path
        description: 'Accepted values: jpg'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v1/photo:
    get:
      tags:
      - Photo
      operationId: PhotoSearch
      parameters:
      - name: reg_id
        in: query
        schema:
          type: string
          default: ''
      - name: net_id
        in: query
        schema:
          type: string
          default: ''
      - name: student_number
        in: query
        schema:
          type: string
          default: ''
      - name: employee_id
        in: query
        schema:
          type: string
          default: ''
      - name: height
        in: query
        schema:
          type: string
          default: ''
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/PhotoSearchViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/PhotoSearchViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/PhotoSearchViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/PhotoSearchViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoSearchViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/PhotoSearchViewModel'
        '400':
          description: Bad Request
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v1:
    get:
      tags:
      - ResourceList
      operationId: GetResources
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/ResourceListViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/ResourceListViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/ResourceListViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/ResourceListViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceListViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ResourceListViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /:
    get:
      tags:
      - Version
      summary: Get available versions
      description: "<pre>\r\n                {\r\n                    \"DisplayTitle\" : \"Service Version\",\r\n        \
        \            \"sws_guid\" : \"3BFD2A3E-5BAE-47D3-9BE2-4A603320F632\",\r\n                    \"LongDescription\" :\
        \ \"Get available versions\",\r\n                    \"ShortDescription\" : \"Get available versions\",\r\n      \
        \              \"OriginatingSchema\" : [{ \"source\": \"hardcoded\" }],\r\n                    \"Notes\" : \"The version\
        \ list resource lists the contract versions that are currently available for the service.\r\n                    \
        \            Each contract version in the list links to a resource list which provides a list of search resources.\r\
        \n                                Also provided in this resource are the code versions that supports the given contract\
        \ versions.\r\n                                The code version is divided into 2 types:\r\n                     \
        \               Domain Core Version\r\n                                    Service Version\r\n                   \
        \             This is primarily useful for change management.\",\r\n                    \"Links\" : [],\r\n      \
        \              \"Synonyms\" : []\r\n                }\r\n                </pre>"
      operationId: GetVersions
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/VersionListViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/VersionListViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/VersionListViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/VersionListViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/VersionListViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/VersionListViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
