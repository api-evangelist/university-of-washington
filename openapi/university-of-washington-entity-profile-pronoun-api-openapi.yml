      tags:
      - entity.profile.pronoun
      summary: Update entity profile pronoun
      description: The entity.profile.pronoun resource allows you to change the pronoun associated with a person.
      parameters:
      - name: validid
        in: path
        description: Entity identifier
        required: true
        schema:
          type: string
          format: string
      requestBody:
        content:
          '*/*':
            schema:
