components:
  schemas:
    EntityProfilePronounPostResult:
      type: object
      properties:
        entity.profile.pronoun:
          type: array
          description: Response to POST
          items:
            type: object
            properties:
              count:
                type: string
                description: Number of records affected
              message:
                type: string
                description: Result of operation (usually 'pronoun set')
    EntityProfilePronounGetResult:
      type: object
      properties:
        entity.profile.pronoun:
          type: array
          description: Array of entity.profile.pronoun objects
          items:
            type: object
            properties:
              validid:
                type: string
                description: Entity identifier
              pronoun:
                type: string
                description: Pronoun value
              logname:
                type: string
                description: Last change author
              updated:
                type: string
                description: Record last updated date
              post_url:
                type: string
                description: URL to post update
        totalcount:
          type: integer
          description: Number of entity.profile.pronoun objects returned
    GenericError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    EntityProfilePronounPostPayload:
      type: object
      properties:
        entity.profile.pronoun:
          type: object
          description: Entity.profile.pronoun object.  See supplemental docs for exact attributes.
          properties:
            validid:
              type: string
              description: Entity identifier
            pronoun:
              type: string
              description: Pronoun value
      description: Note that the entity.profile.pronoun object can also be presented as an array of exactly one object.
