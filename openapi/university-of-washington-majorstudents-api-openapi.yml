      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Major Students Resource URI\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.MajorStudents\"}],\n    \"TargetOperationId\" : [\"GetMajorStudents\"]\n}"
