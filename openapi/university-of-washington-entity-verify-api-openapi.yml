components:
  schemas:
    EntityDeletePutPostResult:
      type: object
      properties:
        entity:
          type: array
          description: Response to DELETE/PUT/POST
          items:
            type: object
            properties:
              count:
                type: string
                description: Number of records affected
              message:
                type: string
                description: Result of operation (usually 'record inserted' or 'record updated')
    EntityVerifyDeletePutPostResult:
      type: object
      properties:
        entity.verify:
          type: array
          description: Response to DELETE/PUT/POST
          items:
            type: object
            properties:
              count:
                type: string
                description: Number of records affected
              message:
