                description: Result of operation (usually 'record inserted' or 'record updated')
    EntityVerifyPutPostPayload:
      type: object
      properties:
        entity.verify:
          type: object
          description: Entity.verify object.  See supplemental docs for exact attributes.
          properties:
            validid:
              type: string
              description: Entity identifier
            verify_code:
              type: string
              description: Verify code
            verify_data:
              type: string
              description: Verify data
              format: email
            source_code:
              type: string
              description: Source code
            instance:
              type: string
              description: Instance number
      description: Note that the entity.verify object can also be presented as an array of exactly one object.
    GenericError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    EntityVerifyGetResult:
      type: object
      properties:
        entity.verify:
          type: array
          description: Array of entity.verify objects
          items:
            type: object
            properties:
              validid:
                type: string
                description: Entity identifier
              verify_code:
                type: string
                description: Verify code
              verify_name:
                type: string
                description: Verify name
              verify_data:
                type: string
                description: Verify data
              source_code:
                type: string
                description: Source code
              source_name:
                type: string
                description: Source name
              instance:
                type: string
                description: Instance number
        totalcount:
          type: string
          description: Number of entity.verify objects returned
      description: Note that the entity.verify object described here documents all possible attributes.  Not all attributes will be returned for all records.
