openapi: 3.2.0
info:
  title: Student Web Service (SWS) Personal Financial API
  description: Student Web Service (SWS) provides a RESTful API to access and update central student data. Subscribe to http://mailman.u.washington.edu/mailman/listinfo/sws-client-app-dev to get notifications about planned outages, support and the announcement of new features.
  contact:
    name: Enterprise Web Services & Events Team
    url: https://itconnect.uw.edu/service/enterprise-web-services-and-events/
    email: sws-support@uw.edu
  version: v5
servers:
- url: /student
tags:
- name: PersonalFinancial
paths:
  /v5/person/{reg_id}/financial:
    get:
      tags:
      - PersonalFinancial
      summary: Get the financial notices for the specified student
      description: '{

        "DisplayTitle" : "Personal Financial",

        "ews_guid" : "1AEDCF78-AEBD-4ECF-BD40-2149F2300DB6",

        "LongDescription" : "Display the financial notices that are relevant to the specified student",

        "ShortDescription" : "Display a student''s financial notices",

        "OriginatingSchema" : [ { "source":"sdb" }, { "source":"uweo" }, { "source":"irws" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:StudentFinancialReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        The personal financial resource describes a UW person in an academic-centric way.

        If the person is a student the person''s name will be the name from the Student System.

        If the person is a faculty that name will be provided by the HR system.",

        "Links" : [ "https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.tuition" ],

        "Synonyms" : []

        }'
      operationId: GetPersonalFinancial
      parameters:
      - name: reg_id
        in: path
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: 'Invalid arg: regid ID'
        '404':
          description: No personal financial found.
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/PersonalFinancialViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/PersonalFinancialViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/PersonalFinancialViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/PersonalFinancialViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalFinancialViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/PersonalFinancialViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
components:
  schemas:
    PersonResourceUri:
      type: object
      properties:
        Name:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"IRWS.identity.uwPersonPrefferredName\" },\n                    { \"source\":\"IRWS.identity.uwPersonRegisteredName\" }\n                ],\n                \"TechnicalDescription\": \"This field is resource specific\"\n            }\n            </pre>"
        RegID:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"IRWS.identity.regid\" }\n                ],\n                \"TechnicalDescription\": \"UW Registration ID. This field is resource specific\"\n            }\n            </pre>"
        Pronouns:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"IRWS.identity.uwPersonPronoun\" }\n                ],\n                \"TechnicalDescription\": \"\"\n            }\n            </pre>"
        Href:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Person Resource URI\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Person\"}],\n    \"TargetOperationId\" : [\"GetPerson\"]\n}"
    PersonalFinancialViewModel:
      type: object
      properties:
        Person:
          $ref: '#/components/schemas/PersonResourceUri'
        AccountBalance:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                   { \"source\":\"SDB.SWI102.acctamt\" }\n                ],\n                \"TechnicalDescription\": \"Account balanace\"\n            }\n            </pre>"
        PCEAccountBalance:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                   { \"source\":\"UWEO.selSWSPersonFinancial.AccountBalance\" }\n                ],\n                \"TechnicalDescription\": \"PCE Account Balance\"\n            }\n            </pre>"
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Personal Financial Model\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.PersonFinancial\"}]\n}"
