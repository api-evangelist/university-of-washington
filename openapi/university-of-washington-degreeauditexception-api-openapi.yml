openapi: 3.2.0
info:
  title: Student Web Service (SWS) Degree Audit Exception API
  description: Student Web Service (SWS) provides a RESTful API to access and update central student data. Subscribe to http://mailman.u.washington.edu/mailman/listinfo/sws-client-app-dev to get notifications about planned outages, support and the announcement of new features.
  contact:
    name: Enterprise Web Services & Events Team
    url: https://itconnect.uw.edu/service/enterprise-web-services-and-events/
    email: sws-support@uw.edu
  version: v5
servers:
- url: /student
tags:
- name: DegreeAuditException
paths:
  /v5/degreeauditexception:
    post:
      tags:
      - DegreeAuditException
      summary: Create a Degree Audit Exception
      description: '{

        "DisplayTitle" : "Degree Audit Exception",

        "ews_guid" : "01F0C569-ED8C-41B8-B20F-1F20A122CD70",

        "LongDescription" : "Create a Degree Audit Exception",

        "ShortDescription" : "Create a Degree Audit Exception",

        "OriginatingSchema" : [ { "source":"sdb" }, { "source":"irws" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:DegreeAuditSubmitter

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        In addition, the SDB driver maintains a list of X.509 certs that are allowed to make changes and access

        degree audit exception info.",

        "Links" : [ "https://wiki.cac.washington.edu/display/SWS/Degree+Audit+Exception+Resource+V5" ],

        "Synonyms" : []

        }'
      operationId: DegreeAuditExceptionCreate
      responses:
        '400':
          description: http body must not be null | http body length must be greater than zero | Unable to parse request to create degree audit exception. | validation of AcceptCode/RejectCode fields failed for your degree audit exception request. Check characters, capitals and typos. | RegId not found.
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
    get:
      tags:
      - DegreeAuditException
      summary: Search for a degree audit exception using the reg_id
      description: '{

        "DisplayTitle" : "Degree Audit Exception Search",

        "ews_guid" : "A8F00FF6-0326-48C1-BBA6-9902BB1BD331",

        "LongDescription" : "Search for a degree audit exception using the reg_id",

        "ShortDescription" : "Search for a degree audit exception",

        "OriginatingSchema" : [ { "source":"sdb" }, { "source":"irws" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:DegreeAuditSubmitter

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        In addition, the SDB driver maintains a list of X.509 certs that are allowed to make changes and access

        degree audit exception info.",

        "Links" : [ "https://wiki.cac.washington.edu/display/SWS/Degree+Audit+Exception+Resource+V5" ],

        "Synonyms" : []

        }'
      operationId: DegreeAuditExceptionSearch
      parameters:
      - name: reg_id
        in: query
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        schema:
          type: string
          default: ''
      responses:
        '400':
          description: 'Invalid arg: regid'
        '404':
          description: No degree audit exceptions found.
        '500':
          description: RegId not found. | InternalServerError
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionSearchViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionSearchViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionSearchViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionSearchViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionSearchViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionSearchViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '503':
          description: ServiceUnavailable
  /v5/degreeauditexception/{regid}:
    get:
      tags:
      - DegreeAuditException
      summary: Get degree audit exceptions for a student
      description: '{

        "DisplayTitle" : "Degree Audit Exception Student Search",

        "ews_guid" : "57A37914-7E83-4A74-9380-C26DB90A845C",

        "LongDescription" : "Get a list of degree audit exceptions for a student",

        "ShortDescription" : "Get a degree audit exception list",

        "OriginatingSchema" : [ { "source":"sdb" }, { "source":"irws" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:DegreeAuditSubmitter

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        In addition, the SDB driver maintains a list of X.509 certs that are allowed to make changes and access

        degree audit exception info.",

        "Links" : [ "https://wiki.cac.washington.edu/display/SWS/Degree+Audit+Exception+Resource+V5" ],

        "Synonyms" : []

        }'
      operationId: GetDegreeAuditException
      parameters:
      - name: regid
        in: path
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: 'Invalid arg: regid'
        '404':
          description: No degree audit exceptions found.
        '500':
          description: RegId not found. | InternalServerError
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionListViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionListViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionListViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionListViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionListViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionListViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '503':
          description: ServiceUnavailable
  /v5/degreeauditexception/{subtype}/{controlcode}/{sequenceno}/{regid}:
    delete:
      tags:
      - DegreeAuditException
      summary: Delete a specific degree audit exception
      description: '{

        "DisplayTitle" : "Degree Audit Exception Delete",

        "ews_guid" : "86C2707B-9E66-40A1-9CEA-B950BC6E7B43",

        "LongDescription" : "Delete a specific degree audit exception",

        "ShortDescription" : "Delete a degree audit exception",

        "OriginatingSchema" : [ { "source":"sdb" }, { "source":"irws" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:DegreeAuditSubmitter

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        In addition, the SDB driver maintains a list of X.509 certs that are allowed to make changes and access

        degree audit exception info.",

        "Links" : [ "https://wiki.cac.washington.edu/display/SWS/Degree+Audit+Exception+Resource+V5" ],

        "Synonyms" : []

        }'
      operationId: DegreeAuditExceptionDelete
      parameters:
      - name: subtype
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: controlcode
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: sequenceno
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: regid
        in: path
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: 'Invalid arg: a control code must be an 2 characters. | Invalid arg: a sequence number must be an integer. | Invalid arg: a subtype is required | Invalid arg: a sequence number is required with this subtype. | Invalid arg: regid'
        '404':
          description: No degree audit exception found.
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
