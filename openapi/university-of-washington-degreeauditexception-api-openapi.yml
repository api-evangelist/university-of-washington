openapi: 3.0.1
info:
  title: IdCard Web Service (IdCardWS) Campus DegreeAuditException API
  description: IdCard Web Service (IdCardWS) provides a RESTful API to UW IdCard data. Subscribe to http://mailman.u.washington.edu/mailman/listinfo/idcardws-users to get notifications about planned outages, support and the announcement of new features.
  contact:
    name: Enterprise Web Services & Events Team
    url: https://itconnect.uw.edu/service/enterprise-web-services-and-events/
    email: idcardws-support@uw.edu
  version: v1
servers:
- url: /idcard
tags:
- name: DegreeAuditException
paths:
  /v5/degreeauditexception:
    post:
      tags:
      - DegreeAuditException
      summary: Create a Degree Audit Exception
      description: "<pre>\r\n                {\r\n                    \"DisplayTitle\" : \"Degree Audit Exception\",\r\n                    \"ews_guid\" : \"01F0C569-ED8C-41B8-B20F-1F20A122CD70\",\r\n                    \"LongDescription\" : \"Create a Degree Audit Exception\",\r\n                    \"ShortDescription\" : \"Create a Degree Audit Exception\",\r\n                    \"OriginatingSchema\" : [ { \"source\":\"sdb\" }, { \"source\":\"irws\" } ],\r\n                    \"Notes\" : \"This resource requires any of the following ASTRA roles:\r\n                                 - sws:Support\r\n                                 - sws:DegreeAuditSubmitter\r\n                               This resource supports the following authentication types:\r\n                                 - X.509 Certificate\r\n                                 - NetID\r\n                               In addition, the SDB driver maintains a list of X.509 certs that are allowed to make changes and access \r\n                               degree audit exception info.\",\r\n                    \"Links\" : [ \"https://wiki.cac.washington.edu/display/SWS/Degree+Audit+Exception+Resource+V5\" ],\r\n                    \"Synonyms\" : []\r\n                }\r\n                </pre>"
      operationId: DegreeAuditExceptionCreate
      responses:
        '400':
          description: http body must not be null | http body length must be greater than zero | Unable to parse request to create degree audit exception. | validation of AcceptCode/RejectCode fields failed for your degree audit exception request. Check characters, capitals and typos. | RegId not found.
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
    get:
      tags:
      - DegreeAuditException
      summary: Search for a degree audit exception using the reg_id
      description: "<pre>\r\n                {\r\n                    \"DisplayTitle\" : \"Degree Audit Exception Search\",\r\n                    \"ews_guid\" : \"A8F00FF6-0326-48C1-BBA6-9902BB1BD331\",\r\n                    \"LongDescription\" : \"Search for a degree audit exception using the reg_id\",\r\n                    \"ShortDescription\" : \"Search for a degree audit exception\",\r\n                    \"OriginatingSchema\" : [ { \"source\":\"sdb\" }, { \"source\":\"irws\" } ],\r\n                    \"Notes\" : \"This resource requires any of the following ASTRA roles:\r\n                                 - sws:Support\r\n                                 - sws:DegreeAuditSubmitter\r\n                               This resource supports the following authentication types:\r\n                                 - X.509 Certificate\r\n                                 - NetID\r\n                               In addition, the SDB driver maintains a list of X.509 certs that are allowed to make changes and access \r\n                               degree audit exception info.\",\r\n                    \"Links\" : [ \"https://wiki.cac.washington.edu/display/SWS/Degree+Audit+Exception+Resource+V5\" ],\r\n                    \"Synonyms\" : []\r\n                }\r\n                </pre>"
      operationId: DegreeAuditExceptionSearch
      parameters:
      - name: reg_id
        in: query
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        schema:
          type: string
          default: ''
      responses:
        '400':
          description: 'Invalid arg: regid'
        '404':
          description: No degree audit exceptions found.
        '500':
          description: RegId not found. | InternalServerError
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionSearchViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionSearchViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionSearchViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionSearchViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionSearchViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionSearchViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '503':
          description: ServiceUnavailable
  /v5/degreeauditexception/{regid}:
    get:
      tags:
      - DegreeAuditException
      summary: Get degree audit exceptions for a student
      description: "<pre>\r\n                {\r\n                    \"DisplayTitle\" : \"Degree Audit Exception Student Search\",\r\n                    \"ews_guid\" : \"57A37914-7E83-4A74-9380-C26DB90A845C\",\r\n                    \"LongDescription\" : \"Get a list of degree audit exceptions for a student\",\r\n                    \"ShortDescription\" : \"Get a degree audit exception list\",\r\n                    \"OriginatingSchema\" : [ { \"source\":\"sdb\" }, { \"source\":\"irws\" } ],\r\n                    \"Notes\" : \"This resource requires any of the following ASTRA roles:\r\n                                 - sws:Support\r\n                                 - sws:DegreeAuditSubmitter\r\n                               This resource supports the following authentication types:\r\n                                 - X.509 Certificate\r\n                                 - NetID\r\n                               In addition, the SDB driver maintains a list of X.509 certs that are allowed to make changes and access \r\n                               degree audit exception info.\",\r\n                    \"Links\" : [ \"https://wiki.cac.washington.edu/display/SWS/Degree+Audit+Exception+Resource+V5\" ],\r\n                    \"Synonyms\" : []\r\n                }\r\n                </pre>"
      operationId: GetDegreeAuditException
      parameters:
      - name: regid
        in: path
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: 'Invalid arg: regid'
        '404':
          description: No degree audit exceptions found.
        '500':
          description: RegId not found. | InternalServerError
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionListViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionListViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionListViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionListViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionListViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/DegreeAuditExceptionListViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '503':
          description: ServiceUnavailable
  /v5/degreeauditexception/{subtype}/{controlcode}/{sequenceno}/{regid}:
    delete:
      tags:
      - DegreeAuditException
      summary: Delete a specific degree audit exception
      description: "<pre>\r\n                {\r\n                    \"DisplayTitle\" : \"Degree Audit Exception Delete\",\r\n                    \"ews_guid\" : \"86C2707B-9E66-40A1-9CEA-B950BC6E7B43\",\r\n                    \"LongDescription\" : \"Delete a specific degree audit exception\",\r\n                    \"ShortDescription\" : \"Delete a degree audit exception\",\r\n                    \"OriginatingSchema\" : [ { \"source\":\"sdb\" }, { \"source\":\"irws\" } ],\r\n                    \"Notes\" : \"This resource requires any of the following ASTRA roles:\r\n                                 - sws:Support\r\n                                 - sws:DegreeAuditSubmitter\r\n                               This resource supports the following authentication types:\r\n                                 - X.509 Certificate\r\n                                 - NetID\r\n                               In addition, the SDB driver maintains a list of X.509 certs that are allowed to make changes and access \r\n                               degree audit exception info.\",\r\n                    \"Links\" : [ \"https://wiki.cac.washington.edu/display/SWS/Degree+Audit+Exception+Resource+V5\" ],\r\n                    \"Synonyms\" : []\r\n                }\r\n                </pre>"
      operationId: DegreeAuditExceptionDelete
      parameters:
      - name: subtype
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: controlcode
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: sequenceno
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: regid
        in: path
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: 'Invalid arg: a control code must be an 2 characters. | Invalid arg: a sequence number must be an integer. | Invalid arg: a subtype is required | Invalid arg: a sequence number is required with this subtype. | Invalid arg: regid'
        '404':
          description: No degree audit exception found.
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
