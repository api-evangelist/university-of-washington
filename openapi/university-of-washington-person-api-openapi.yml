openapi: 3.2.0
info:
  title: University Of Washington Person API
  version: '1.0'
  description: 'Operations tagged Person across 2 of this provider''s published API definitions: university-of-washington-identity-registry-web-service-v2-openapi.yml, university-of-washington-student-web-service.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://mango.u.washington.edu:646/registry/v2
- url: /student
tags:
- name: Person
paths:
  /person:
    get:
      tags:
      - Person
      summary: The Person resource supports several Source record types.
      description: 'The Person endpoint allows searching for a person by certain identifiers. Search parameters can be specified in a querystring or a JSON payload.


        Note that you must search on one (and only one) of the primary searchable parameters: validid, ssn, studentid, lname, regid, or uwnetid. However, you may also search by fname, lname, or birthdate in addition to the one of the primary searchable parameters. For example, you could search by lname and birthdate.


        IMPORTANT: search parameters MUST NOT be left blank--only include parameters you are searching for in the querystring (the automatically generated URL below contains blank search parameters).'
      parameters:
      - name: validid
        in: query
        description: Source record identifier
        schema:
          type: string
          format: string
      - name: ssn
        in: query
        description: Social Security Number
        schema:
          type: string
          format: string
      - name: studentid
        in: query
        description: Student ID Number
        schema:
          type: string
          format: string
      - name: lname
        in: query
        description: Last Name
        schema:
          type: string
          format: string
      - name: regid
        in: query
        description: UW RegID
        schema:
          type: string
          format: string
      - name: uwnetid
        in: query
        description: UW NetID
        schema:
          type: string
          format: string
      - name: -type
        in: query
        description: Data return type
        schema:
          type: string
          format: string
          default: json
      - name: -pretty
        in: query
        description: Request pretty-printed data for humans
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: An array of person objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSearchResult'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: payload
      operationId: getPerson
      x-operation-id-source: derived
    servers:
    - url: https://mango.u.washington.edu:646/registry/v2
  /person/{source}/{validid}:
    get:
      tags:
      - Person
      summary: The Person resource supports several Source record types.
      description: The source endpoint allows you to retrieve the source record for a person.
      parameters:
      - name: source
        in: path
        description: 'Source record type to query.  Options are: ''uwhr'', ''oea'', ''mugs'', ''sdb'''
        required: true
        schema:
          type: string
          format: string
      - name: validid
        in: path
        description: Unique identifier for source record.  e.g. Employee ID number
        required: true
        schema:
          type: string
          format: string
      - name: -type
        in: query
        description: Data return type
        schema:
          type: string
          format: string
          default: json
      - name: -pretty
        in: query
        description: Request pretty-printed data for humans
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Person record.  Schema contains list of all possible properties but they may not all be present depending on source type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getPersonBySourceByValidid
      x-operation-id-source: derived
    put:
      tags:
      - Person
      summary: The source endpoint allows you to create a source record for a person.
      description: 'The Person resource supports several Source record types. A source record is information that describes a part of a person''s overall identity (e.g. for a student employee, their student source record would contain their student information, and their employee source record wouldd contain their employee information).


        Note that which parameters are required varies from one source to another. For more information see: https://wiki.cac.washington.edu/x/tZpNB.'
      parameters:
      - name: source
        in: path
        description: 'Source record type to create.  Options are: ''oea'', ''mugs'', ''hepps'', ''sdb'''
        required: true
        schema:
          type: string
          format: string
      - name: validid
        in: path
        description: Unique identifier for source record.  e.g. Student ID number
        required: true
        schema:
          type: string
          format: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/PersonPutPostPayloadGeneric'
        required: true
      responses:
        '200':
          description: Person record.  Schema contains list of all possible properties but they may not all be present depending on source type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPutPostResult'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
