        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: payload
      operationId: putPersonBySourceByValidid
      x-operation-id-source: derived
    post:
      tags:
      - Person
      summary: The source endpoint allows you to update a source record for a person
      description: 'The Person resource supports several Source record types. A source record is information that describes a part of a person''s overall identity (e.g. for a student employee, their student source record would contain their student information, and their employee source record would contain their employee information).


        Note that which parameters are required varies from one source to

        another. For more information see: https://wiki.cac.washington.edu/x/tZpNB.'
      parameters:
      - name: source
        in: path
        description: 'Source record type to update.  Options are: ''uwhr'', ''oea'', ''mugs'', ''sdb'''
        required: true
        schema:
          type: string
          format: string
      - name: validid
        in: path
        description: Unique identifier for source record.  e.g. Employee ID number
        required: true
        schema:
          type: string
          format: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/PersonPutPostPayloadGeneric'
        required: true
      responses:
        '200':
          description: Person record.  Schema contains list of all possible properties but they may not all be present depending on source type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPutPostResult'
        '400':
          description: Invalid identifier type
          content:
