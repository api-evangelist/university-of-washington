  /person/{source}/{validid}/pac:
    post:
      tags:
      - Person
      summary: The pac endpoint allows you to generate a PAC for a person
      description: A PAC is not automatically generated when a new person record is created. A PAC can be created or updated by a POST operation on the pac endpoint.
      parameters:
      - name: source
        in: path
        description: 'Source record type to update.  Options are: ''uwhr'', ''oea'', ''mugs'', ''sdb'''
        required: true
        schema:
          type: string
          format: string
      - name: validid
        in: path
        description: Unique identifier for source record.  e.g. Employee ID number
        required: true
        schema:
          type: string
          format: string
      responses:
        '200':
          description: Message confirming PAC creation. Includes PAC and expiration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  person:
                    type: array
                    description: Response to PUT
                    items:
                      type: object
                      properties:
                        pac:
                          type: string
                          description: generated PAC
                        expiration:
                          type: string
                          description: Expiration date of PAC YYYY-MM-DD hh:mm:ss
                        message:
                          type: string
                          description: response message (usually 'pac set')
                  totalcount:
                    type: integer
                    description: Number of results returned
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
