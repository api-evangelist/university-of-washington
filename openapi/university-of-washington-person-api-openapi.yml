        "DisplayTitle" : "Update Registration Blocks",

        "ews_guid" : "316f881d-1ad4-49ce-8489-56f640a69d4e",

        "LongDescription" : "Update a student''s registration blocks by their reg_id",

        "ShortDescription" : "Update a student''s registration blocks by their reg_id",

        "OriginatingSchema" : [ { "source":"sdb" },

        "Notes" : "This resource requires any of the following ASTRA roles:

