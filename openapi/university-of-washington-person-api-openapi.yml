        - sws:StudentDisabilityReader

        - sws:StudentEthnicityReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        The academic adviser resource describes the academic advisers for a student. If the person is a not student

        then there will be no records found. Adviser data can come various sources such as programs (Undergraduate Advising, Honors,

        Office of Minority Affairs, etc.) as well as specific departments (Engineering, Arts, etc.).",

