          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: payload
      operationId: postPersonBySourceByValidid
      x-operation-id-source: derived
    servers:
    - url: https://mango.u.washington.edu:646/registry/v2
