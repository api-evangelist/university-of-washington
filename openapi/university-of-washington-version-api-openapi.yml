paths:
  /:
    get:
      tags:
      - Version
      summary: Get available versions
      description: '{

        "DisplayTitle" : "Service Version",

        "sws_guid" : "3BFD2A3E-5BAE-47D3-9BE2-4A603320F632",

        "LongDescription" : "Get available versions",

        "ShortDescription" : "Get available versions",

        "OriginatingSchema" : [{ "source": "hardcoded" }],

        "Notes" : "The version list resource lists the contract versions that are currently available for the service.

        Each contract version in the list links to a resource list which provides a list of search resources.

        Also provided in this resource are the code versions that supports the given contract versions.

        The code version is divided into 2 types:

        Domain Core Version

        Service Version

        This is primarily useful for change management.",

        "Links" : [],

        "Synonyms" : []

        }'
      operationId: GetVersions
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/VersionListViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/VersionListViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/VersionListViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/VersionListViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/VersionListViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/VersionListViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
    servers:
    - url: /idcard
