              schema:
                $ref: '#/components/schemas/GenericError'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
      operationId: getAccountMailByUwnetidBySubscriptionCode
      x-operation-id-source: derived
    post:
      tags:
      - account.mail
      summary: Set mail forwarding records
      description: The account.mail resource allows you to set the mail forwarding records for an account.
      parameters:
      - name: uwnetid
        in: path
        description: UW Network identifier
        required: true
        schema:
          type: string
          format: string
