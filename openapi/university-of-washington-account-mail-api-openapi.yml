components:
  schemas:
    AccountMailGetResult:
      type: object
      properties:
        account.mail:
          type: array
          description: Array of account.mail objects
          items:
            type: object
            properties:
              uwnetid:
                type: string
                description: UW Network identifier
              subscription_code:
                type: string
                description: Subscription code
              subscription_name:
                type: string
                description: Subscription name
              address:
                type: string
                description: Mail forwarding address
              post_url:
                type: string
                description: URL to post update
        totalcount:
          type: string
          description: Number of account.mail objects returned
      description: Note that the account.mail object described here documents all possible attributes.  Not all attributes will be returned for all records.
    AccountMailDeleteResult:
      type: object
      properties:
        account.mail:
          type: array
          description: Response to DELETE
          items:
            type: object
            properties:
              message:
                type: string
                description: Response message (usually 'mail forwarding set')
    AccountMailPostResult:
      type: object
      properties:
        account.mail:
          type: array
          description: Response to POST
          items:
            type: object
            properties:
              address:
                type: string
                description: Mail forwarding address
              message:
                type: string
                description: Result of operation (usually 'mail forwarding set')
    GenericError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    AccountMailPostPayload:
      type: object
      properties:
        account.mail:
          type: object
          description: Account.mail object.  See reference docs for exact attributes.
          properties:
            uwnetid:
              type: string
              description: UW Network identifier
            subscription_code:
              type: string
              description: Subscription code
            address:
              type: string
              description: Mail forwarding address
      description: Note that the account.mail object can also be presented as an array of exactly one object.
