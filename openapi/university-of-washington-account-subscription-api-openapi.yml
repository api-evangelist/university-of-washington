components:
  schemas:
    AccountSubscriptionGetResult:
      type: object
      properties:
        account.subscription:
          type: array
          description: Array of account.subscription objects
          items:
            type: object
            properties:
              uwnetid:
                type: string
                description: UW Network identifier
              subscription_code:
                type: string
                description: Subscription code
              subscription_name:
                type: string
                description: Subscription name
              subscription_data:
                type: string
                description: Subscription data
              pac:
                type: string
                description: Private access code indicator (E=expired; P=permanent; Y=one-time)
              notify_code:
                type: string
                description: Notification code
              notify_date:
                type: string
                description: Notification date
              status_code:
                type: string
                description: Status code
              status_name:
                type: string
                description: Status name
              logname:
                type: string
                description: Last change author
              created:
                type: string
                description: Record created date
              updated:
                type: string
                description: Record last updated date
              post_url:
                type: string
                description: URL to post update
        totalcount:
          type: string
          description: Number of account.subscription objects returned
      description: Note that the account.subscription object described here documents all possible attributes.  Not all attributes will be returned for all records.
    AccountSubscriptionDeletePutPostResult:
      type: object
      properties:
        account.subscription:
          type: array
          description: Response to DELETE/PUT/POST
          items:
            type: object
            properties:
              count:
                type: string
                description: Number of records affected
              message:
                type: string
                description: Result of operation (usually 'record inserted' or 'record updated')
    GenericError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    AccountSubscriptionPutPostPayload:
      type: object
      properties:
        account.subscription:
          type: object
          description: Account.subscription object.  See reference docs for exact attributes.
          properties:
            uwnetid:
              type: string
              description: UW Network identifier
            subscription_code:
              type: string
              description: Subscription code
            subscription_data:
              type: string
              description: Subscription data
            notify_code:
              type: string
              description: Notification code
            status_code:
              type: string
              description: Status code
      description: Note that the account.subscription object can also be presented as an array of exactly one object.
