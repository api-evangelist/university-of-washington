                $ref: '#/components/schemas/GenericError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
      operationId: getAccountSubscriptionByUwnetidBySubscriptionCode
      x-operation-id-source: derived
