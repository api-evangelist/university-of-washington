      - name: regid
        in: query
        description: Registry identifier (e.g., regid=1F1F1F1F1F1FF1F1F1F1F1F1F1F1F1F1)
        required: true
        schema:
          type: string
          format: string
      - name: validid
        in: query
        description: Entity identifier (e.g., validid=uwhr=123456789)
        required: true
