components:
  schemas:
    RegidJoinResult:
      type: object
      properties:
        regid:
          type: array
          description: Array of regid objects (should generally contain only one).
          items:
            type: object
            properties:
              count:
                type: string
                description: Internal API string
              regid:
                type: string
                description: Regid on the new, merged record
              prior_regid:
                type: string
                description: Regid of the record that was joined to this one
              message:
                type: string
                description: Result of operation.  Usually 'Entities Joined'
        totalcount:
          type: string
          description: Number of results returned
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              format: int32
            message:
              type: string
    RegidPutPostPayload:
      type: object
      properties:
        regid:
          type: object
          description: Regid object.  See supplemental docs for exact attributes.
          properties:
            regid:
              type: string
              description: Registry identifier
            test:
              type: string
              description: Test status
            status_code:
              type: string
              description: Status of source record
      description: Note that the regid object can also be presented as an array of exactly one object.
    RegidDeletePutPostResult:
      type: object
      properties:
        regid:
          type: array
          description: Response to DELETE/PUT/POST
          items:
            type: object
            properties:
              count:
                type: string
                description: Number of records affected
              message:
                type: string
                description: Result of operation (usually 'record inserted' or 'record updated')
    GenericError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    RegidGetResult:
      type: object
      properties:
        regid:
          type: array
          description: Array of regid objects
          items:
            type: object
            properties:
              regid:
                type: string
                description: Registry identifier
              entity_code:
                type: string
                description: Entity code
              entity_name:
                type: string
                description: Entity name
              test:
                type: string
                description: Test status
              status_code:
                type: string
                description: Status of source record
              status_name:
                type: string
                description: Status of source record
              logname:
                type: string
                description: Last change author
              created:
                type: string
                description: Record created date
              updated:
                type: string
                description: Record last updated date
              post_url:
                type: string
                description: URL to post update
        totalcount:
          type: integer
          description: Number of records affected
      description: Note that the regid object described here documents all possible attributes.  Not all attributes will be returned for all records.
