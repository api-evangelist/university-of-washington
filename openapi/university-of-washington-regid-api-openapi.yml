paths:
  /regid/{prior_regid}/join:
    post:
      tags:
      - Regid
      summary: The regid join endpoint allows you to join two regids
      description: When two regids are joined, the regid specified in the querystring 'to_regid' becomes the regid for all records formerly associated with {prior_regid}.
      parameters:
      - name: prior_regid
        in: path
        description: Regid to be abandoned.
        required: true
        schema:
          type: string
          format: string
      - name: to_regid
        in: query
        description: Regid to be the identifier on the new, merged record (target_regid).
        required: true
        schema:
          type: string
          format: string
      responses:
        '200':
          description: Join response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegidJoinResult'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
