openapi: 3.2.0
info:
  title: Student Web Service (SWS) Registration API
  description: Student Web Service (SWS) provides a RESTful API to access and update central student data. Subscribe to http://mailman.u.washington.edu/mailman/listinfo/sws-client-app-dev to get notifications about planned outages, support and the announcement of new features.
  contact:
    name: Enterprise Web Services & Events Team
    url: https://itconnect.uw.edu/service/enterprise-web-services-and-events/
    email: sws-support@uw.edu
  version: v5
servers:
- url: /student
tags:
- name: Registration
paths:
  /v5/registration/{year},{quarter},{curriculum_abbreviation},{course_number},{section_id},{reg_id},{duplicate_code}:
    get:
      tags:
      - Registration
      summary: Get the registration associating a student with a particular course section
      description: '{

        "DisplayTitle" : "Registration with Duplicate Code",

        "ews_guid" : "6E4840B1-C6C1-47F2-8366-07BAAFE5F358",

        "LongDescription" : "The Registration resource represents a given student''s association to a specific course section,

        and can refer to both current, past, and future associations.",

        "ShortDescription" : "Search for a registration record",

        "OriginatingSchema" : [ { "source":"swssdb" }, { "source":"uweo" }, { "source":"irws" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:GradeSubmitter

        - sws:GradeReader

        - sws:UnitReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID ",

        "Links" : [ "https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.studentcourseregistration" ],

        "Synonyms" : []

        }'
      operationId: GetRegistration
      parameters:
      - name: year
        in: path
        description: 'The 4 digit year.  For example: 2025'
        required: true
        schema:
          type: string
      - name: quarter
        in: path
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        required: true
        schema:
          type: string
      - name: curriculum_abbreviation
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: course_number
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: section_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: reg_id
        in: path
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        required: true
        schema:
          type: string
      - name: duplicate_code
        in: path
        description: "Optional parameter (made optional by question mark in template).  Duplicate Code allows registration of a student in a given section multiple times. \n            The duplicate code argument uniquely identifies a specific registration record among others within the same course section. For example, an initial registration may begin with 'Added to class' (duplicate code blank), but then at a later point may become 'Dropped from class' (duplicate code A), followed by a re-registration into the course section 'Added to class' (duplicate code B). \n            When a registration is transcript-ed(prior quarter) the duplicate codes will often change to a numeral(1,2,3...) and many of the original registrations will be removed and replaced with a single transcript record. \n            Duplicate codes are not serial but often appear to be. They are to be used only to identify uniqueness and should not be assumed to represent any business meaning."
        required: true
        schema:
          maxLength: 1
          minLength: 1
          type: string
          default: ''
      responses:
        '400':
          description: 'Invalid arg: year | Invalid arg: quarter | Invalid arg: curriculum abbreviation | Invalid arg: course number | Invalid arg: section id | Invalid arg: reg ID | Invalid arg: duplicate code | Student not found for regid'
        '404':
          description: No registration found.
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/RegistrationViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/RegistrationViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/RegistrationViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/RegistrationViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/RegistrationViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v5/registration/{year},{quarter},{curriculum_abbreviation},{course_number},{section_id},{reg_id},:
    get:
      tags:
      - Registration
      summary: Get the registration associating a student with a particular course section
      description: '{

        "DisplayTitle" : "Registration",

        "ews_guid" : "6E4840B1-C6C1-47F2-8366-07BAAFE5F358",

        "LongDescription" : "The Registration resource represents a given student''s association to a specific course section,

        and can refer to both current, past, and future associations.",

        "ShortDescription" : "Search for a registration record",

        "OriginatingSchema" : [ { "source":"swssdb" }, { "source":"uweo" }, { "source":"irws" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:GradeSubmitter

        - sws:GradeReader

        - sws:UnitReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID ",

        "Links" : [ "https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.studentcourseregistration" ],

        "Synonyms" : []

        }'
      operationId: GetRegistrationNoDupeCode
      parameters:
      - name: year
        in: path
        description: 'The 4 digit year.  For example: 2025'
        required: true
        schema:
          type: string
      - name: quarter
        in: path
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        required: true
        schema:
          type: string
      - name: curriculum_abbreviation
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: course_number
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: section_id
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: reg_id
        in: path
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        required: true
        schema:
          type: string
      responses:
        '400':
          description: 'Invalid arg: year | Invalid arg: quarter | Invalid arg: curriculum abbreviation | Invalid arg: course number | Invalid arg: section id | Invalid arg: reg ID | Invalid arg: duplicate code | Student not found for regid'
        '404':
          description: No registration found.
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/RegistrationViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/RegistrationViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/RegistrationViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/RegistrationViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/RegistrationViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v5/registration:
    get:
      tags:
      - Registration
      summary: Search for registrations that match the supplied parameters
      description: '{

        "DisplayTitle" : "Registration Search",

        "ews_guid" : "72184D14-4C07-4EBB-AE85-1ABD4979B106",

        "LongDescription" : "Search for a registration record in many ways",

        "ShortDescription" : "Search for registration records",

        "OriginatingSchema" : [ { "source":"swssdb" }, { "source":"uweo" }, { "source":"irws" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:GradeReader

        - sws:GradeSubmitter

        - sws:UnitReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        To return a list of all the student enrollment activity for a specified section including adds and drops,

        enter values for the Year, Quarter, Curriculum Abbreviation, and Section ID attributes.

        To return a list of all students who are actively enrolled in the specified section, enter values

        for the Year, Quarter, Curriculum Abbreviation, and Section ID attributes, and select the Active

        Registrations checkbox.

        To return a list of all sections in which a specified student is actively enrolled, enter the Year, Quarter,

        and Reg_ID attributes and select the Active Registrations checkbox.

        To return list of all sections in which a student is enrolled including those that have been dropped,

        enter the Year, Quarter, and Reg_ID attributes. Notice that is_active has been omitted. The default value

        for this attribute is off.",

        "Links" : [ "https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.studentcourseregistration" ],

        "Synonyms" : []

        }'
      operationId: RegistrationSearch
      parameters:
      - name: year
        in: query
        description: 'The 4 digit year.  For example: 2025'
        schema:
          type: string
          default: ''
      - name: quarter
        in: query
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        schema:
          type: string
          default: ''
      - name: curriculum_abbreviation
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: course_number
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: section_id
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: reg_id
        in: query
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        schema:
          type: string
          default: ''
      - name: is_active
        in: query
        description: Choose on or true to enable.  Otherwise off or false.
        schema:
          type: string
          default: ''
      - name: instructor_reg_id
        in: query
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        schema:
          type: string
          default: ''
      - name: verbose
        in: query
        description: Choose on or true to enable.  Otherwise off or false. If enabled it returns a list of search result URIs and some information about each registration. Each item contains a link that can be used to request a single registration payload.  If disabled (default) it returns a full list of registration resource payloads.
        schema:
          type: string
          default: ''
      - name: changed_since_date
        in: query
        description: If you have a value in ChangedSinceDate all other input fields will be ignored and will return all data that has changed since the date entered. This is used for applications that only need the changes since they last checked without having to know specific details to search by.
        schema:
          type: string
          default: ''
      - name: transcriptable_course
        in: query
        description: "Choose yes, no, or all. If yes then results will include any course that can be creditable such that it can be shown on a transcript. This would include certain classes that also fall under the Educational Outreach (EO). Yes is also the default value chosen for this search criteria if none is specified.\n            If no then only classes from EO will be returned.\n            If all, both transcriptable and non-transcriptable courses will be returned.\n            All will return every course regardless of whether it can be included in a transcript or not."
        schema:
          type: string
          default: 'yes'
      - name: page_size
        in: query
        description: ''
        schema:
          type: string
      - name: page_start
        in: query
        description: ''
        schema:
          type: string
      responses:
        '400':
          description: 'Invalid arg: year | Invalid arg: quarter | Invalid arg: curriculum abbreviation | Invalid arg: course number | Invalid arg: section id | Invalid arg: reg ID | Invalid arg: isactive | RegistrationSearch only supports searches using 3-8 params. | Invalid input: Cannot use cache bypass with use of transcriptable system or changed since | Invalid input | Student not found for regid | Maximum size for a change since request is 1000 | Page size must be an integer between 1 and 500, inclusive.'
        '404':
          description: No registration found.
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/RegistrationSearchViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/RegistrationSearchViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/RegistrationSearchViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/RegistrationSearchViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationSearchViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/RegistrationSearchViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
components:
  schemas:
    SectionResourceUri:
      type: object
      properties:
        Href:
          type:
          - string
          - 'null'
        Year:
          type: integer
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration_courses.regis_yr\" },\n                    { \"source\":\"SWSSDB.transcript_courses_taken.tran_yr\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.Year\"},\n                    { \"source\":\"SDB.SWI202.trm.yr\" }\n                ],\n                \"TechnicalDescription\": \"Year\"\n            }\n            </pre>"
          format: int32
        Quarter:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration_courses.regis_qtr\" },\n                    { \"source\":\"SWSSDB.transcript_courses_taken.tran_qtr\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.Quarter\"},\n                    { \"source\":\"SDB.SWI202.trm.qtr\" }\n                ],\n                \"TechnicalDescription\": \"Quarter\"\n            }\n            </pre>"
        CurriculumAbbreviation:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.sect.dept\" }\n                ],\n                \"TechnicalDescription\": \"Curriculum abbreviation\"\n            }\n            </pre>"
        CourseNumber:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.sect.crsn\" }\n                ],\n                \"TechnicalDescription\": \"Course number\"\n            }\n            </pre>"
        SectionID:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.sect.csid\" },\n                    { \"source\":\"UWEO.selSWSCourseSections.SectionID\"}\n                ],\n                \"TechnicalDescription\": \"Section ID\"\n            }\n            </pre>"
        SLN:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.sect.sln\" },\n                    { \"source\":\"UWEO.selSWSCourseSections.SLN\"}\n                ],\n                \"TechnicalDescription\": \"SLN\"\n            }\n            </pre>"
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Section Resource URI\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Section\"}],\n    \"TargetOperationId\" : [\"GetSection\"]\n}"
    RegistrationSearchViewModel:
      type: object
      properties:
        TotalCount:
          type: integer
          format: int32
        PageSize:
          type:
          - string
          - 'null'
        PageStart:
          type:
          - string
          - 'null'
        Registrations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RegistrationViewModelBase'
        Current:
          $ref: '#/components/schemas/RegistrationSearchResourceUri'
        Next:
          $ref: '#/components/schemas/RegistrationSearchResourceUri'
        Previous:
          $ref: '#/components/schemas/RegistrationSearchResourceUri'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Registration Search Model\"\n}"
    PersonResourceUri:
      type: object
      properties:
        Name:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"IRWS.identity.uwPersonPrefferredName\" },\n                    { \"source\":\"IRWS.identity.uwPersonRegisteredName\" }\n                ],\n                \"TechnicalDescription\": \"This field is resource specific\"\n            }\n            </pre>"
        RegID:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"IRWS.identity.regid\" }\n                ],\n                \"TechnicalDescription\": \"UW Registration ID. This field is resource specific\"\n            }\n            </pre>"
        Pronouns:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"IRWS.identity.uwPersonPronoun\" }\n                ],\n                \"TechnicalDescription\": \"\"\n            }\n            </pre>"
        Href:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Person Resource URI\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Person\"}],\n    \"TargetOperationId\" : [\"GetPerson\"]\n}"
    RegistrationSearchResourceUri:
      type: object
      properties:
        Year:
          type:
          - integer
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration_courses.regis_yr\" },\n                    { \"source\":\"SWSSDB.transcript_courses_taken.tran_yr\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.year\" }\n                ],\n                \"TechnicalDescription\": \"Year\"\n            }\n            </pre>"
          format: int32
        Quarter:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration_courses.regis_qtr\" },\n                    { \"source\":\"SWSSDB.transcript_courses_taken.tran_qtr\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.quarter\" }\n                ],\n                \"TechnicalDescription\": \"Quarter\"\n            }\n            </pre>"
        RegID:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"IRWS.identity.regid\" }\n                ],\n                \"TechnicalDescription\": \"UW Registration ID\"\n            }\n            </pre>"
        SectionID:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.time_schedule.section_id\" },\n                    { \"source\":\"SWSSDB.transcript_courses_taken.section_id\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.section_id\" }\n                ],\n                \"TechnicalDescription\": \"Section ID\"\n            }\n            </pre>"
        IsActive:
          type: boolean
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration_courses.request_status\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.is_active\" }\n                ],\n                \"TechnicalDescription\": \"Is registration active\"\n            }\n            </pre>"
        Verbose:
          type: boolean
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"url\" }\n                ],\n                \"TechnicalDescription\": \"User supplied value for determining payload size\"\n            }\n            </pre>"
        CurriculumAbbreviation:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.time_schedule.dept_abbrev\" },\n                    { \"source\":\"SWSSDB.transcript_courses_taken.dept_abbrev\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.curriculum_abbreviation\" }\n                ],\n                \"TechnicalDescription\": \"Curriculum abbreviation\"\n            }\n            </pre>"
        CourseNumber:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.time_schedule.course_no\" },\n                    { \"source\":\"SWSSDB.transcript_courses_taken.course_number\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.course_number\" }\n                ],\n                \"TechnicalDescription\": \"Course number\"\n            }\n            </pre>"
        InstructorRegID:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_course_instr.fac_ssn\" },\n                    { \"source\":\"url\" }\n                ],\n                \"TechnicalDescription\": \"Instructor id\"\n            }\n            </pre>"
        ChangedSinceDate:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"url\" }\n                ],\n                \"TechnicalDescription\": \"Pulled from viewstate. Used to filter search results.\"\n            }\n            </pre>"
        TranscriptableCourse:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"url\" }\n                ],\n                \"TechnicalDescription\": \"Pulled from viewstate. Used to filter search results.\"\n            }\n            </pre>"
        PageStart:
          type:
          - string
          - 'null'
        PageSize:
          type:
          - string
          - 'null'
        Href:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Registration Search Resource URI\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Registration\"}],\n    \"TargetOperationId\" : [\"RegistrationSearch\"]\n}"
    RegistrationViewModelBase:
      type: object
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Registration Model\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Registration\"}],\n    \"RuntimeTypes\" : [\"RegistrationViewModel\"]\n}"
    RegistrationViewModel:
      type: object
      properties:
        Section:
          $ref: '#/components/schemas/SectionResourceUri'
        Person:
          $ref: '#/components/schemas/PersonResourceUri'
        DuplicateCode:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration_courses.dup_enroll\" },\n                    { \"source\":\"url\" }\n                ],\n                \"TechnicalDescription\": \"Duplicate code. 0 or empty depending on flipyear for EO.\"\n            }\n            </pre>"
        Href:
          type:
          - string
          - 'null'
          format: uri
        Instructor:
          $ref: '#/components/schemas/PersonResourceUri'
        RequestStatus:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration_courses.request_status\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.request_status\" }\n                ],\n                \"TechnicalDescription\": \"Request Status\"\n            }\n            </pre>"
        IsActive:
          type: boolean
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration_courses.request_status\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.is_active\" }\n                ],\n                \"TechnicalDescription\": \"Is registration active\"\n            }\n            </pre>"
        RequestDate:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration_courses.request_dt\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.request_date\" }\n                ],\n                \"TechnicalDescription\": \"Request date\"\n            }\n            </pre>"
        Credits:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration_courses.credits\" },\n                    { \"source\":\"SWSSDB.transcript_courses_taken.course_credits\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.credits\" }\n                ],\n                \"TechnicalDescription\": \"Credits\"\n            }\n            </pre>"
        VariableCredit:
          type: boolean
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration_courses.v_cred\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.variable_credits\" }\n                ],\n                \"TechnicalDescription\": \"Variable Credits\"\n            }\n            </pre>"
