      additionalProperties: false
      description: "{\r\n    \"DisplayTitle\" : \"Course Search Resource URI\",\r\n    \"TargetSchema\" : [{\"target\" : \"SWS.Course\"}],\r\n    \"TargetOperationId\" : [\"CourseSearch\"]\r\n}"
