          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.course.max_qtr_credits\" },\n                    { \"source\":\"UWEO.selSWSCourse.MaximumTermCredit\" }\n                ],\n                \"TechnicalDescription\": \"Maximum term credit\"\n            }\n            </pre>"
          format: double
        MaximumCredit:
