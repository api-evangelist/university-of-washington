openapi: 3.2.0
info:
  title: Student Web Service (SWS) Department API
  description: Student Web Service (SWS) provides a RESTful API to access and update central student data. Subscribe to http://mailman.u.washington.edu/mailman/listinfo/sws-client-app-dev to get notifications about planned outages, support and the announcement of new features.
  contact:
    name: Enterprise Web Services & Events Team
    url: https://itconnect.uw.edu/service/enterprise-web-services-and-events/
    email: sws-support@uw.edu
  version: v5
servers:
- url: /student
tags:
- name: Department
paths:
  /v5/department:
    get:
      tags:
      - Department
      summary: Search for departments that match the supplied parameters
      description: '{

        "DisplayTitle" : "Department Search",

        "ews_guid" : "D9639897-147A-4091-955A-549E643B70A2",

        "LongDescription" : "Display a list of departments by college_abbreviation and optionally filter on year, quarter and

        future_terms",

        "ShortDescription" : "List of departments",

        "OriginatingSchema" : [ { "source":"swssdb" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:GradeSubmitter

        - sws:UnitReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        - AccessToken ",

        "Links" : [ "https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.department" ],

        "Synonyms" : []

        }'
      operationId: DepartmentSearch
      parameters:
      - name: year
        in: query
        description: 'The 4 digit year.  For example: 2025'
        schema:
          type: string
          default: ''
      - name: quarter
        in: query
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        schema:
          type: string
          default: ''
      - name: future_terms
        in: query
        description: Number of future terms to look ahead
        schema:
          type: integer
          format: int32
          default: 0
      - name: college_abbreviation
        in: query
        description: ''
        schema:
          type: string
          default: ''
      responses:
        '400':
          description: Invalid input | DepartmentSearch only supports searches using 1 param.
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/DepartmentSearchViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/DepartmentSearchViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/DepartmentSearchViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/DepartmentSearchViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentSearchViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/DepartmentSearchViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
components:
  schemas:
    DepartmentSearchResourceUri:
      type: object
      properties:
        CollegeAbbreviation:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_dept_code.dept_college\" }\n                ],\n                \"TechnicalDescription\": \"CollegeAbbreviation\"\n            }\n            </pre>"
        FutureTerms:
          type: integer
          format: int32
        Quarter:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_major_code.major_first_qtr\" }\n                ],\n                \"TechnicalDescription\": \"Quarter\"\n            }\n            </pre>"
        Year:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_major_code.major_first_yr\" }\n                ],\n                \"TechnicalDescription\": \"Year\"\n            }\n            </pre>"
        Href:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Department Search Resource URI\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Department\"}],\n    \"TargetOperationId\" : [\"DepartmentSearch\"]\n}"
    DepartmentSearchViewModel:
      type: object
      properties:
        TotalCount:
          type: integer
          format: int32
        Departments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DepartmentResourceUri'
          readOnly: true
        Current:
          $ref: '#/components/schemas/DepartmentSearchResourceUri'
        Next:
          $ref: '#/components/schemas/DepartmentSearchResourceUri'
        Previous:
          $ref: '#/components/schemas/DepartmentSearchResourceUri'
        PageSize:
          type:
          - string
          - 'null'
        PageStart:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Department Search Model\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Department\"}]\n}"
    DepartmentResourceUri:
      type: object
      properties:
        DepartmentAbbreviation:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_dept_code.dept_abbr\" }\n                ],\n                \"TechnicalDescription\": \"DepartmentAbbreviation\"\n            }\n            </pre>"
        DepartmentFullName:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_dept_code.dept_full_nm\" }\n                ],\n                \"TechnicalDescription\": \"DepartmentFullName\"\n            }\n            </pre>"
        Quarter:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_major_code.major_first_qtr\" }\n                ],\n                \"TechnicalDescription\": \"Quarter\"\n            }\n            </pre>"
        Year:
          type: integer
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_major_code.major_first_yr\" }\n                ],\n                \"TechnicalDescription\": \"Year\"\n            }\n            </pre>"
          format: int32
        Href:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Department Resource URI\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Department\"}],\n    \"TargetOperationId\" : [\"DepartmentSearch\"]\n}"
