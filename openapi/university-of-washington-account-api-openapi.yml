components:
  schemas:
    AccountSearchResults:
      type: object
      properties:
        account:
          type: array
          description: List of identities returned
          items:
            type: object
            properties:
              ledger:
                type: object
                properties:
                  regid:
                    type: string
                    description: Unique identifier for a person
                  accounts:
                    type: object
                    properties:
                      personal:
                        type: array
                        description: list of links to account records (usually only one)
                        items:
                          type: string
                          description: link to account record
                      temporary:
                        type: array
                        description: list of links to account records (usually only one)
                        items:
                          type: string
                          description: link to account record
                      administrator:
                        type: array
                        description: list of links to account records (usually only one)
                        items:
                          type: string
                          description: link to account record
                      holder:
                        type: array
                        description: list of links to account records (usually only one)
                        items:
                          type: string
                          description: link to account record
                      forwarding:
                        type: array
                        description: list of links to account records (usually only one)
                        items:
                          type: string
                          description: link to account record
                    description: Accounts associated with this identity--most people will just have one of type 'personal'
                description: Identity object (contains identity info for a single person)
        totalcount:
          type: string
          description: Number of results returned
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              format: int32
            message:
              type: string
    AccountLookupResult:
      type: object
      properties:
        account:
          type: array
          description: ''
          items:
            type: object
            properties:
              uwnetid:
                type: string
              accid:
                type: string
              validid:
                type: string
              uid:
                type: string
              luid:
                type: string
              account:
                type: string
              disenfran:
                type: string
              netid_code:
                type: string
              netid_name:
                type: string
              status_code:
                type: string
              status_name:
                type: string
              logname:
                type: string
              created:
                type: string
              updated:
                type: string
            description: ''
        totalcount:
          type: integer
          description: Number of records affected
    AccountDeletePutPostResult:
      type: object
      properties:
        account:
          type: array
          description: Response to DELETE/PUT/POST
          items:
            type: object
            properties:
              count:
                type: string
                description: Number of records affected
              message:
                type: string
                description: Result of operation (usually 'record inserted' or 'record updated')
    AccountPutPostPayload:
      type: object
      properties:
        account:
          type: object
          description: Account object.  See supplemental docs for exact attributes.
          properties:
            uwnetid:
              type: string
              description: UW Network identifier
            uid:
              type: string
              description: UID
            account:
              type: string
              description: Account name
            disenfran:
              type: string
              description: Disenfranchise indicator
            netid_code:
              type: string
              description: Code for UW NetID type
            status_code:
              type: string
              description: Status of account record
      description: Note that the account object can also be presented as an array of exactly one object.
    GenericError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    AccountGetResult:
      type: object
      properties:
        account:
          type: array
          description: Array of account objects
          items:
            type: object
            properties:
              uwnetid:
                type: string
                description: UW Network identifier
              accid:
                type: string
                description: Account identifier
              validid:
                type: string
                description: Entity identifier
              uid:
                type: string
                description: UID
              account:
                type: string
                description: Account name
              disenfran:
                type: string
                description: Disenfranchise indicator
              netid_code:
                type: string
                description: Code for UW NetID type
              netid_name:
                type: string
                description: UW NetID Type
              status_code:
                type: string
                description: Status of account record
              status_name:
                type: string
                description: Status of account record
              logname:
                type: string
                description: Last change author
              created:
                type: string
                description: Record created date
              updated:
                type: string
                description: Record last updated date
              post_url:
                type: string
                description: URL to post update
        totalcount:
          type: string
          description: Number of account objects returned
      description: Note that the account object described here documents all possible attributes.  Not all attributes will be returned for all records.
    AccountSearchResult:
      type: object
      properties:
        account:
          type: array
          description: Array of account search objects
          items:
            type: object
            properties:
              regid:
                type: string
                description: Registry identifier
              lname:
                type: string
                description: Primary last name
              fname:
                type: string
                description: Primary first name
              mname:
                type: string
                description: Primary middle name
              accounts:
                type: object
                properties:
                  personal:
                    type: array
                    description: Array of personal URLs
                    items:
                      type: string
                      description: Personal account URL
                  administrator:
                    type: array
                    description: Array of administrator URLs
                    items:
                      type: string
                      description: Administrator account URL
                  reserved:
                    type: array
                    description: Array of reserved URLs
                    items:
                      type: string
                      description: Reserved account URL
                  holder:
                    type: array
                    description: Array of holder URLs
                    items:
                      type: string
                      description: Holder account URL
                  forwarding:
                    type: array
                    description: Array of forwarding URLs
                    items:
                      type: string
                      description: Forwarding account URL
                  temporary:
                    type: array
                    description: Array of temporary URLs
                    items:
                      type: string
                      description: Temporary account URL
                description: List of account records for this entity and associated URLs (example)
        totalcount:
          type: string
          description: Number of account search objects returned
