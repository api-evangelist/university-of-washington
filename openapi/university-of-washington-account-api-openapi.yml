openapi: 3.2.0
info:
  title: University Of Washington Account API
  version: '1.0'
  description: 'Operations tagged Account across 2 of this provider''s published API definitions: university-of-washington-identity-registry-web-service-v2-openapi.yml, university-of-washington-identity-registry-web-service-v3-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://mango.u.washington.edu:646/registry/v2
- url: https://mango.u.washington.edu:646/registry/v3
tags:
- name: Account
paths:
  /account:
    get:
      tags:
      - Account
      summary: The account endpoint allows you to search for a record within the account…
      description: 'You can search for an account record based on certain criteria. Search parameters can be specified as a querystring or a JSON payload. Only one search parameter can be specified (any single query parameter, or a single parameter specified in a JSON payload).


        For details on search behavior please see: https://wiki.cac.washington.edu/x/l59NB.'
      parameters:
      - name: validid
        in: query
        description: Search by validid by specifying an identifier (e.g. validid=uwhr=123456789)
        schema:
          type: string
          format: string
          default: uwhr=123456789
      - name: -type
        in: query
        description: Data return type
        schema:
          type: string
          format: string
          default: json
      - name: -pretty
        in: query
        description: Request pretty-printed data for humans
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: 'Account search results.  '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSearchResults'
      x-codegen-request-body-name: payload
      operationId: getAccount
      x-operation-id-source: derived
    servers:
    - url: https://mango.u.washington.edu:646/registry/v2
  /account/{accounttype}/{identifier}:
    get:
      tags:
      - Account
      summary: The accounttype endpoint allows you to look up a UW NetID
      description: If you know the account type and identifier you can look up an account directly.
      parameters:
      - name: accounttype
        in: path
        description: 'Type of account.  Options are: ''personal'', ''temporary'', ''administrator'', ''holder'', ''forwarding'''
        required: true
        schema:
          type: string
          format: string
      - name: identifier
        in: path
        description: Account identifier, generally a UW NetID
        required: true
        schema:
          type: string
          format: string
      - name: -type
        in: query
        description: Data return type
        schema:
          type: string
          format: string
          default: json
      - name: -pretty
        in: query
        description: Request pretty-printed data for humans
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: 'Account search results.  '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLookupResult'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getAccountByAccounttypeByIdentifier
      x-operation-id-source: derived
    servers:
    - url: https://mango.u.washington.edu:646/registry/v2
  /account/{uwnetid}/{netid_code}:
    get:
      tags:
      - Account
      summary: Query account record
      description: The account resource allows you to retrieve an account record.
      parameters:
      - name: uwnetid
        in: path
        description: UW Network identifier
        required: true
        schema:
          type: string
          format: string
      - name: netid_code
        in: path
        description: Netid code (optional)
        required: true
        schema:
          type: string
          format: string
      - name: -type
        in: query
        description: Data return type
        schema:
          type: string
          format: string
          default: json
      - name: -pretty
        in: query
        description: Request pretty-printed data for humans
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Account record. Schema contains list of all possible properties but they may not all be present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGetResult'
        '400':
          description: Invalid identifier type
          content:
