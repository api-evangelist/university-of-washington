components:
  schemas:
    RegidJoinResult:
      type: object
      properties:
        regid:
          type: array
          description: Array of regid objects (should generally contain only one).
          items:
            type: object
            properties:
              count:
                type: string
                description: Internal API string
              regid:
                type: string
                description: 'Regid on the new, merged record'
              prior_regid:
                type: string
                description: Regid of the record that was joined to this one
              message:
                type: string
                description: Result of operation.  Usually 'Entities Joined'
        totalcount:
          type: string
          description: Number of results returned
    PersonPutPostPayloadUWHR:
      type: object
      properties:
        person:
          type: array
          description: >-
            Array of person objects (should generally contain only one).  The
            payload demonstrated is for the uwhr source.
          items:
            type: object
            properties:
              studentid:
                type: string
                description: Student ID Number (only use for student employees)
              ssn:
                type: string
                description: Social Security Number
              emp_ecs_code:
                type: string
                description: Employee ECS code
              emp_status_code:
                type: string
                description: Employee status code
              lname:
                type: string
                description: Last Name
              fname:
                type: string
                description: First Name
              mname:
                type: string
                description: Middle Name
              birthdate:
                type: string
                description: Date of Birth YYYY-MM-DD
              org_supervisor:
                type: string
                description: EID of employee supervisor
              workday_home_email:
                type: string
                description: Employee Home Email Address
                format: email
              department:
                type: string
                description: Employee Department Name
              priorid:
                type: string
                description: Historical Validid (Workday Reference ID)
              status_code:
                type: string
                description: Status Code
    PersonPutPostResult:
      type: object
      properties:
        person:
          type: array
          description: Response to PUT
          items:
            type: object
            properties:
              count:
                type: integer
                description: Number of records affected
              validid:
                type: integer
                description: Unique identifier for record
              regid:
                type: string
                description: RegID of person
              message:
                type: string
                description: >-
                  Result of operation (usually 'record inserted' or 'record
                  updated')
    PersonSearchResult:
      type: object
      properties:
        person:
          type: array
          description: Array of identity objects matching search parameters
          items:
            type: object
            properties:
              identity:
                type: object
                properties:
                  regid:
                    type: string
                    description: Unique identifier for a person.
                  lname:
                    type: string
                    description: Last name.
                  fname:
                    type: string
                    description: First name.
                  identifiers:
                    type: object
                    properties:
                      uwhr:
                        type: string
                        description: UW HR source URL
                      sdb:
                        type: string
                        description: UW SDB source URL
                    description: >-
                      list of source records for this person and associated URLs
                      (example)
        totalcount:
          type: string
          description: Number of results returned
    PersonSearchQuery:
      type: object
      properties:
        person:
          type: array
          description: List of search parameters
          items:
            type: object
            properties:
              lname:
                type: string
                description: Primary OR secondary search parameter
              validid:
                type: string
                description: The unique identifier for a source record
              studentid:
                type: string
              regid:
                type: string
              uwnetid:
                type: string
              fname:
                type: string
                description: Secondary search parameter
              birthdate:
                type: string
                description: Secondary search parameter
    Person:
      type: object
      properties:
        person:
          type: array
          description: Array of person objects (should generally contain only one)
          items:
            type: object
            properties:
              validid:
                type: string
                description: Unique identifier for this source record
              regid:
                type: string
                description: Unique identifier for a person
              priorid:
                type: string
                description: Historical Validid (Workday Reference ID)
              ssn:
                type: string
                description: Social Security Number
              studentid:
                type: integer
                description: Student ID Number
              lname:
                type: string
                description: Last name
              fname:
                type: string
                description: First name
              birthdate:
                type: string
                description: Date of birth YYYY-MM-DD
              categories:
                type: array
                description: List of categories
                items:
                  type: object
                  properties:
                    category code:
                      type: integer
                      description: Category code
                    category_name:
                      type: string
                      description: Category name
              org_supervisor:
                type: string
                description: EID of employee supervisor
              pac:
                type: string
                description: Private Access Code
              wp_name:
                type: string
                description: >-
                  Name to publish in White Pages Directory.  Pipe separated:
                  First Last | Last | First
              wp_department:
                type: array
                description: List of departments
                items:
                  type: string
                  description: Description of department
              wp_email:
                type: array
                description: List of email addresses
                items:
                  type: string
                  description: Email address
              wp_phone:
                type: array
                description: List of phone numbers
                items:
                  type: string
                  description: Phone number
              wp_title:
                type: array
                description: List of job titles
                items:
                  type: string
                  description: Job title
              wp_address:
                type: array
                description: List of physical addresses
                items:
                  type: string
                  description: Physical address
              wp_publish:
                type: string
                description: White pages publish flag
              department:
                type: string
                description: Supervisory org name for primary position
              mailstop:
                type: string
                description: Campus mailbox number
              payroll_unit_code:
                type: string
                description: Payroll unit code
              emp_ecs_code:
                type: string
                description: Employee ECS code
              emp_status_code:
                type: string
                description: Employee status code
              workday_home_email:
                type: string
                description: Employee Home Email Address
              budget:
                type: string
                description: ''
              workday_emp_status:
                type: string
                description: ''
              workday_con_status:
                type: string
                description: ''
              workday_aff_status:
                type: string
                description: ''
              workday_last_active:
                type: string
                description: 'Last Active Classification (E, C, or A)'
              source_code:
                type: string
                description: Validation source
              source_name:
                type: string
                description: Validation source
              status_code:
                type: string
                description: Status of source record
              status_name:
                type: string
                description: Status of source record
              in_feed:
                type: string
                description: ''
              created:
                type: string
                description: Record created date
              updated:
                type: string
                description: Record last updated date
              expiration:
                type: string
                description: AVF Expiration Date
        totalcount:
          type: string
          description: Number of results returned
      description: >-
        Note that the person object described here documents all possible
        attributes for all possible sources.  No source will return all of these
        attributes.
    AccountSearchResults:
      type: object
      properties:
        account:
          type: array
          description: List of identities returned
          items:
            type: object
            properties:
              ledger:
                type: object
                properties:
                  regid:
                    type: string
                    description: Unique identifier for a person
                  accounts:
                    type: object
                    properties:
                      personal:
                        type: array
                        description: list of links to account records (usually only one)
                        items:
                          type: string
                          description: link to account record
                      temporary:
                        type: array
                        description: list of links to account records (usually only one)
                        items:
                          type: string
                          description: link to account record
                      administrator:
                        type: array
                        description: list of links to account records (usually only one)
                        items:
                          type: string
                          description: link to account record
                      holder:
                        type: array
                        description: list of links to account records (usually only one)
                        items:
                          type: string
                          description: link to account record
                      forwarding:
                        type: array
                        description: list of links to account records (usually only one)
                        items:
                          type: string
                          description: link to account record
                    description: >-
                      Accounts associated with this identity--most people will
                      just have one of type 'personal'
                description: Identity object (contains identity info for a single person)
        totalcount:
          type: string
          description: Number of results returned
    AccountSearchQuery:
      type: object
      properties:
        account:
          type: array
          description: ''
          items:
            type: object
            properties:
              validid:
                type: string
                description: Search parameter
                default: uwhr=123456789
            description: ''
    SocialQuery:
      type: object
      properties:
        social:
          type: array
          description: test
          items:
            required:
              - display_name
              - fname
              - lname
            type: object
            properties:
              validid:
                type: string
                description: >-
                  Unique identifier from social identity provider.  Must match
                  validid defined in URL.  Must be URL encoded if appropriate.  
              fname:
                type: string
                description: First Name
              lname:
                type: string
                description: Last Name
              display_name:
                type: string
                description: Display Name
              contact_email:
