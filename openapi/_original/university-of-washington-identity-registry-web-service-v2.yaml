openapi: 3.0.1
info:
  title: Identity Registration Web Service REST API V2
  description: >+
    This is the API specification for V2 of the UW-IT Identity Registry Rest
    API.  Note that there are header and querystring paramemters not
    documentered here--they can be found in the main API documentation at
    https://wiki.cac.washington.edu/x/H5lNB.  The -type and -pretty querystring
    parameters are included here for GET requests since they make testing much
    easier.  

  version: '2'
servers:
  - url: 'https://mango.u.washington.edu:646/registry/v2'
paths:
  /person:
    get:
      tags:
        - Person
      summary: >-
        The Person resource supports several Source record types.  A source
        record is information that describes a part of a person's overall
        identity (e.g. for a student employee, their student source record would
        contain their student information, and their employee source record
        would contain their employee information).
      description: >-
        The Person endpoint allows searching for a person by certain
        identifiers. Search parameters can be specified in a querystring or a
        JSON payload.  

         Note that you must search on one (and only one) of the primary searchable parameters: validid, ssn, studentid, lname, regid, or uwnetid.  However, you may also search by fname, lname, or birthdate in addition to the one of the primary searchable parameters. For example, you could search by lname and birthdate.  

         IMPORTANT:  search parameters MUST NOT be left blank--only include parameters you are searching for in the querystring (the automatically generated URL below contains blank search parameters).   
      parameters:
        - name: validid
          in: query
          description: Source record identifier
          schema:
            type: string
            format: string
        - name: ssn
          in: query
          description: Social Security Number
          schema:
            type: string
            format: string
        - name: studentid
          in: query
          description: Student ID Number
          schema:
            type: string
            format: string
        - name: lname
          in: query
          description: Last Name
          schema:
            type: string
            format: string
        - name: regid
          in: query
          description: UW RegID
          schema:
            type: string
            format: string
        - name: uwnetid
          in: query
          description: UW NetID
          schema:
            type: string
            format: string
        - name: '-type'
          in: query
          description: Data return type
          schema:
            type: string
            format: string
            default: json
        - name: '-pretty'
          in: query
          description: Request pretty-printed data for humans
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: An array of person objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonSearchResult'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: payload
  '/person/{source}/{validid}':
    get:
      tags:
        - Person
      summary: >-
        The Person resource supports several Source record types.  A source
        record is information that describes a part of a person's overall
        identity (e.g. for a student employee, their student source record would
        contain their student information, and their employee source record
        would contain their employee information).
      description: >
        The source endpoint allows you to retrieve the source record for a
        person.  
      parameters:
        - name: source
          in: path
          description: >-
            Source record type to query.  Options are: 'uwhr', 'oea', 'mugs',
            'sdb'
          required: true
          schema:
            type: string
            format: string
        - name: validid
          in: path
          description: Unique identifier for source record.  e.g. Employee ID number
          required: true
          schema:
            type: string
            format: string
        - name: '-type'
          in: query
          description: Data return type
          schema:
            type: string
            format: string
            default: json
        - name: '-pretty'
          in: query
          description: Request pretty-printed data for humans
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: >-
            Person record.  Schema contains list of all possible properties but
            they may not all be present depending on source type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Person
      summary: >-
        The source endpoint allows you to create a source record for a person. 
        Note that there is a slightly altered format for PUT operations for the
        uwhr source.  It is described separately under the "/person/uwhr/*"
        endpoint.  
      description: >-
        The Person resource supports several Source record types.  A source
        record is information that describes a part of a person's overall
        identity (e.g. for a student employee, their student source record would
        contain their student information, and their employee source record
        wouldd contain their employee information). 

         Note that which parameters are required varies from one source to another.  For more information see:   https://wiki.cac.washington.edu/x/tZpNB.
      parameters:
        - name: source
          in: path
          description: >-
            Source record type to create.  Options are: 'oea', 'mugs', 'hepps',
            'sdb'
          required: true
          schema:
            type: string
            format: string
        - name: validid
          in: path
          description: Unique identifier for source record.  e.g. Student ID number
          required: true
          schema:
            type: string
            format: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/PersonPutPostPayloadGeneric'
        required: true
      responses:
        '200':
          description: >-
            Person record.  Schema contains list of all possible properties but
            they may not all be present depending on source type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPutPostResult'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: payload
    post:
      tags:
        - Person
      summary: The source endpoint allows you to update a source record for a person.
      description: >-
        The Person resource supports several Source record types. A source
        record is information that describes a part of a person's overall
        identity (e.g. for a student employee, their student source record would
        contain their student information, and their employee source record
        would contain their employee information).



          Note that which parameters are required varies from one source to
        another.  For more information see:  
        https://wiki.cac.washington.edu/x/tZpNB.
      parameters:
        - name: source
          in: path
          description: >-
            Source record type to update.  Options are: 'uwhr', 'oea', 'mugs',
            'sdb'
          required: true
          schema:
            type: string
            format: string
        - name: validid
          in: path
          description: Unique identifier for source record.  e.g. Employee ID number
          required: true
          schema:
            type: string
            format: string
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/PersonPutPostPayloadGeneric'
        required: true
      responses:
        '200':
          description: >-
            Person record.  Schema contains list of all possible properties but
            they may not all be present depending on source type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPutPostResult'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: payload
  /person/uwhr/*:
    put:
      tags:
        - Person
      summary: >-
        This endpoint is specifically for creating an employee source record for
        the uwhr source.  
      description: >-
        This endpoint is a special case of the '/person/{source}/{validid}'
        endpoint.  However, it doesn't take validid as an argument--it generates
        a validid and returns it in the payload. 
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/PersonPutPostPayloadUWHR'
        required: true
      responses:
        '200':
          description: >-
            Person record.  Schema contains list of all possible properties but
            they may not all be present depending on source type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPutPostResult'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: payload
  '/person/{source}/{validid}/pac':
    post:
      tags:
        - Person
      summary: The pac endpoint allows you to generate a PAC for a person.
      description: >
        A PAC is not automatically generated when a new person record is
        created. A PAC can be created or updated by a POST operation on the pac
        endpoint.  
      parameters:
        - name: source
          in: path
          description: >-
            Source record type to update.  Options are: 'uwhr', 'oea', 'mugs',
            'sdb'
          required: true
          schema:
            type: string
            format: string
        - name: validid
          in: path
          description: Unique identifier for source record.  e.g. Employee ID number
          required: true
          schema:
            type: string
            format: string
      responses:
        '200':
          description: Message confirming PAC creation. Includes PAC and expiration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  person:
                    type: array
                    description: Response to PUT
                    items:
                      type: object
                      properties:
                        pac:
                          type: string
                          description: generated PAC
                        expiration:
                          type: string
                          description: 'Expiration date of PAC YYYY-MM-DD hh:mm:ss'
                        message:
                          type: string
                          description: response message (usually 'pac set')
                  totalcount:
                    type: integer
                    description: Number of results returned
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account:
    get:
      tags:
        - Account
      summary: >-
        The account endpoint allows you to search for a record within the
        account resource.  
      description: >-
        You can search for an account record based on certain criteria.  Search
        parameters can be specified as a querystring or a JSON payload.  Only
        one search parameter can be specified (any single query parameter, or a
        single parameter specified in a JSON payload).  

         For details on search behavior please see:  https://wiki.cac.washington.edu/x/l59NB.
      parameters:
        - name: validid
          in: query
          description: >-
            Search by validid by specifying an identifier (e.g.
            validid=uwhr=123456789)
          schema:
            type: string
            format: string
            default: uwhr=123456789
        - name: '-type'
          in: query
          description: Data return type
          schema:
            type: string
            format: string
            default: json
        - name: '-pretty'
          in: query
          description: Request pretty-printed data for humans
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: 'Account search results.  '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSearchResults'
      x-codegen-request-body-name: payload
  '/account/{accounttype}/{identifier}':
    get:
      tags:
        - Account
      summary: 'The accounttype endpoint allows you to look up a UW NetID.  '
      description: >-
        If you know the account type and identifier you can look up an account
        directly.  
      parameters:
        - name: accounttype
          in: path
          description: >-
            Type of account.  Options are: 'personal', 'temporary',
            'administrator', 'holder', 'forwarding'
          required: true
          schema:
            type: string
            format: string
        - name: identifier
          in: path
          description: 'Account identifier, generally a UW NetID'
          required: true
          schema:
            type: string
            format: string
        - name: '-type'
          in: query
          description: Data return type
          schema:
            type: string
            format: string
            default: json
        - name: '-pretty'
          in: query
          description: Request pretty-printed data for humans
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: 'Account search results.  '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLookupResult'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/social/{recordidentifier}/{identifier}':
    put:
      tags:
        - Social
      summary: >-
        The social identifier endpoint allows you to read, create, and update
        social identities.
      description: >-
        You can register a social identity from Google or Facebook through
        IRWS.  You obtain your user's data from their social login, and must
        submit it to the registry to receive a response.  If the data you submit
        is different from the existing data, the existing data will be
        overwritten. 
      parameters:
        - name: recordidentifier
          in: path
          description: Social identity provider.  Allowed values are 'facebook' or 'google'
          required: true
          schema:
            type: string
            format: string
        - name: identifier
          in: path
          description: >-
            Unique identifier from social identity provider.  Must be URL
            encoded if appropriate
          required: true
          schema:
            type: string
            format: string
        - name: '-type'
          in: query
          description: Data return type
          schema:
            type: string
            format: string
            default: json
        - name: '-pretty'
          in: query
          description: Request pretty-printed data for humans
          schema:
            type: boolean
            default: true
      requestBody:
        description: JSON payload containing social login data
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/SocialQuery'
        required: true
      responses:
        '200':
          description: Social Identity query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialResult'
      x-codegen-request-body-name: payload
  '/pdsentry/{regid}/':
    get:
      tags:
        - Pdsentry
      summary: The pdsentry endpoint allows you to read person directory information.
      description: >-
        You can read person directory information through queries to this
        endpoint.  Person entities can be referenced by regid.
      parameters:
        - name: regid
          in: path
          description: regid of person entity
          required: true
          schema:
            type: string
            format: string
        - name: '-type'
          in: query
          description: Data return type
          schema:
            type: string
            format: string
            default: json
        - name: '-pretty'
          in: query
          description: Request pretty-printed data for humans
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Pdsentry query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdsEntryResult'
        '301':
          description: Moved Permanently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/pdsentry/validid={source}={validid}/':
    get:
      tags:
        - Pdsentry
      summary: >-
        The pdsentry search endpoint allows you to search for a person entity in
        the person directory.
      description: >-
        You can search person directory information through queries to this
        endpoint.  Person entities can be searched for by certain source
        identifiers.  Note the syntax for pdsentry searches is not consistent
        with other resources.  The supported search identifiers are lname,
        regid, employeeid, studentid, uwnetid, and sdb
      parameters:
        - name: source
          in: path
          description: >-
            Source record type to query. Options are: 'lname', 'regid',
            'employeeid', 'studentid', 'uwnetid', 'sdb'
          required: true
          schema:
            type: string
            format: string
        - name: validid
          in: path
          description: Identifier for source record. e.g. Employee ID number
          required: true
          schema:
            type: string
            format: string
        - name: '-type'
          in: query
          description: Data return type
          schema:
            type: string
            format: string
            default: json
        - name: '-pretty'
          in: query
          description: Request pretty-printed data for humans
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Pdsentry query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdsEntryResult'
        '301':
          description: Moved Permanently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/name/{identifier}':
    get:
      tags:
        - Name
      summary: >-
        The name endpoint allows you to read source-independent names associated
        with person entities.
      description: >-
        The name resource gets a display name for a person entity.  The name is
        independent of source records.  That is, it applies across all different
        affiliations a person might have (student, employee, etc.).
      parameters:
        - name: identifier
          in: path
          description: >-
            Instutional identifier for a source record associated with the
            person.  The RegID, UW Employee ID Number, or UW Student Number can
            be used.  
          required: true
          schema:
            type: string
            format: string
        - name: '-type'
          in: query
          description: Data return type
          schema:
            type: string
            format: string
            default: json
        - name: '-pretty'
          in: query
          description: Request pretty-printed data for humans
          schema:
            type: boolean
            default: true
