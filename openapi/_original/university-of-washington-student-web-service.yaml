openapi: 3.0.1
info:
  title: Student Web Service (SWS)
  description: Student Web Service (SWS) provides a RESTful API to access and update central student data. Subscribe to http://mailman.u.washington.edu/mailman/listinfo/sws-client-app-dev
    to get notifications about planned outages, support and the announcement of new features.
  contact:
    name: Enterprise Web Services & Events Team
    url: https://itconnect.uw.edu/service/enterprise-web-services-and-events/
    email: sws-support@uw.edu
  version: v5
servers:
- url: /student
paths:
  /v5/campus:
    get:
      tags:
      - Campus
      summary: Get available campuses
      description: "<pre>\r\n                {\r\n                    \"DisplayTitle\" : \"Campus List\",\r\n            \
        \        \"ews_guid\" : \"317D6605-20FA-4D10-80A0-75C655B489F3\",\r\n                    \"LongDescription\" : \"\
        Display a list of campuses\",\r\n                    \"ShortDescription\" : \"Campus list\",\r\n                 \
        \   \"OriginatingSchema\" : [ { \"source\":\"hardcoded\" } ],\r\n                    \"Notes\" : \"This resource requires\
        \ any of the following ASTRA roles:\r\n                                 - sws:Support\r\n                        \
        \         - sws:GradeSubmitter\r\n                                 - sws:UnitReader\r\n                          \
        \     This resource supports the following authentication types:\r\n                                 - X.509 Certificate\r\
        \n                                 - NetID\r\n                                 - AccessToken\r\n                 \
        \              Unlike other search resources, it does not require any query string to return the search result.\"\
        ,\r\n                    \"Links\" : [ \"https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.campus\" ],\r\n\
        \                    \"Synonyms\" : []\r\n                }\r\n                </pre>"
      operationId: CampusSearch
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/CampusSearchViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/CampusSearchViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/CampusSearchViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/CampusSearchViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/CampusSearchViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/CampusSearchViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v5/college:
    get:
      tags:
      - College
      summary: Search for colleges that match the supplied parameters
      description: "<pre>\r\n                {\r\n                    \"DisplayTitle\" : \"College Search\",\r\n         \
        \           \"ews_guid\" : \"76D0EC71-692F-42A9-959C-3C4EA5D8A1F4\",\r\n                    \"LongDescription\" :\
        \ \"Display a filtered list of colleges.  \r\n                                          Can filter by year, quarter,\
        \ how many future terms to look ahead, and campus short name.\",\r\n                    \"ShortDescription\" : \"\
        Display a filtered list of colleges\",\r\n                    \"OriginatingSchema\" : [ { \"source\":\"swssdb\" }\
        \ ],\r\n                    \"Notes\" : \"This resource requires any of the following ASTRA roles:\r\n           \
        \                      - sws:Support\r\n                                 - sws:GradeSubmitter\r\n                \
        \                 - sws:UnitReader\r\n                               This resource supports the following authentication\
        \ types:\r\n                                 - X.509 Certificate\r\n                                 - NetID\r\n \
        \                                - AccessToken\r\n                               For campus short name refer to the\
        \ campus resource.\",\r\n                    \"Links\" : [ \"https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.college\"\
        \ ],\r\n                    \"Synonyms\" : []\r\n                }\r\n                </pre>"
      operationId: CollegeSearch
      parameters:
      - name: year
        in: query
        description: 'The 4 digit year.  For example: 2025'
        schema:
          type: string
          default: ''
      - name: quarter
        in: query
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        schema:
          type: string
          default: ''
      - name: future_terms
        in: query
        description: Number of future terms to look ahead
        schema:
          type: integer
          format: int32
          default: 0
      - name: campus_short_name
        in: query
        description: Choose Seattle, Bothell, or Tacoma
        schema:
          type: string
          default: ''
      responses:
        '400':
          description: Invalid input
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/CollegeSearchViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/CollegeSearchViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/CollegeSearchViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/CollegeSearchViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/CollegeSearchViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/CollegeSearchViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v5/course/{year},{quarter},{curriculum_abbreviation},{course_number}:
    get:
      tags:
      - Course
      summary: Get the information about a specific course
      description: "<pre>\r\n                {\r\n                    \"DisplayTitle\" : \"Course\",\r\n                 \
        \   \"ews_guid\" : \"A081D91E-7332-4975-9C5E-67F0133CC94C\",\r\n                    \"LongDescription\" : \"Display\
        \ the information about a specific course. \r\n                                          Can filter by year, quarter,\
        \ curriculum and course number.\",\r\n                    \"ShortDescription\" : \"Display the information about a\
        \ specific course\",\r\n                    \"OriginatingSchema\" : [ { \"source\":\"sdb\" }, { \"source\":\"swssdb\"\
        \ }, { \"source\":\"uweo\" } ],\r\n                    \"Notes\" : \"This resource requires any of the following ASTRA\
        \ roles:\r\n                                 - sws:Support\r\n                                 - sws:GradeSubmitter\r\
        \n                                 - sws:UnitReader\r\n                               This resource supports the following\
        \ authentication types:\r\n                                 - X.509 Certificate\r\n                              \
        \   - NetID\r\n                                 - AccessToken\r\n                               For curriculum abbreviations\
        \ see the curriculum resource.\",\r\n                    \"Links\" : [ \"https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.course\"\
        \ ],\r\n                    \"Synonyms\" : []\r\n                }\r\n                </pre>"
      operationId: GetCourse
      parameters:
      - name: year
        in: path
        description: 'The 4 digit year.  For example: 2025'
        required: true
        schema:
          maxLength: 4
          minLength: 4
          type: string
      - name: quarter
        in: path
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        required: true
        schema:
          maxLength: 6
          minLength: 6
          type: string
      - name: curriculum_abbreviation
        in: path
        required: true
        schema:
          type: string
      - name: course_number
        in: path
        required: true
        schema:
          maxLength: 3
          minLength: 3
          type: string
      responses:
        '400':
          description: 'Invalid arg: year | Invalid arg: quarter | Invalid arg: curriculum abbreviation | Invalid arg: course
            number'
        '404':
          description: No course with requested year, quarter, curriculum, and course number found.
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/CourseViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/CourseViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/CourseViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/CourseViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/CourseViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/CourseViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v5/course:
    get:
      tags:
      - Course
      summary: ''
      description: "<pre>\r\n                 {\r\n                     \"DisplayTitle\" : \"Course Search\",\r\n        \
        \             \"ews_guid\" : \"991BDC13-42C4-4EF7-991B-785CC2516B0E\",\r\n                     \"LongDescription\"\
        \ : \"Search for courses that match the supplied parameters\",\r\n                     \"ShortDescription\" : \"Search\
        \ for courses\",\r\n                     \"OriginatingSchema\" : [ { \"source\":\"swssdb\" }, { \"source\":\"uweo\"\
        \ } ],\r\n                     \"Notes\" : \"This resource requires any of the following ASTRA roles:\r\n        \
        \                          - sws:Support\r\n                                  - sws:GradeSubmitter\r\n           \
        \                       - sws:UnitReader\r\n                                This resource supports the following authentication\
        \ types:\r\n                                  - X.509 Certificate\r\n                                  - NetID\r\n\
        \                                  - AccessToken\r\n                                You do not need to specify all\
        \ parameters to return a successful search result. This search resource \r\n                                supports\
        \ different combinations of search parameters to provide different search results.\r\n                           \
        \     For curriculum abbreviations see the curriculum resource.\",\r\n                     \"Links\" : [ \"https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.course\"\
        \ ],\r\n                     \"Synonyms\" : []\r\n                 }\r\n                 </pre>"
      operationId: CourseSearch
      parameters:
      - name: year
        in: query
        description: 'The 4 digit year.  For example: 2025'
        schema:
          type: string
          default: ''
      - name: quarter
        in: query
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        schema:
          type: string
          default: ''
      - name: curriculum_abbreviation
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: course_number
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: course_title_contains
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: course_title_starts
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: exclude_courses_without_sections
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: future_terms
        in: query
        description: Number of future terms to look ahead
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: page_start
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: changed_since_date
        in: query
        description: If you have a value in ChangedSinceDate all other input fields will be ignored and will return all data
          that has changed since the date entered. This is used for applications that only need the changes since they last
          checked without having to know specific details to search by.
        schema:
          type: string
          default: ''
      - name: transcriptable_course
        in: query
        description: "Choose yes, no, or all. If yes then results will include any course that can be creditable such that\
          \ it can be shown on a transcript. This would include certain classes that also fall under the Educational Outreach\
          \ (EO). Yes is also the default value chosen for this search criteria if none is specified.\r\n            If no\
          \ then only classes from EO will be returned.\r\n            If all then both transcriptable and non-transcriptable\
          \ courses will be returned.\r\n            All will return every course regardless of whether it can be included\
          \ in a transcript or not."
        schema:
          type: string
          default: 'yes'
      - name: view_unpublished
        in: query
        description: ''
        schema:
          type: string
          default: 'false'
      responses:
        '400':
          description: Invalid input | Invalid number of future terms | exclude_courses_without_sections used with future_terms
            is undefined | Maximum size for a change since request is 1000 | Page start must be an integer greater than 0.
            | Maximum size for a change since request is 1000 | Only transcriptable course or changed since or curriculum
            abbreviation or course title starts or course title contains can be used as a single search parameter
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/CourseSearchViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/CourseSearchViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/CourseSearchViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/CourseSearchViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSearchViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/CourseSearchViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
