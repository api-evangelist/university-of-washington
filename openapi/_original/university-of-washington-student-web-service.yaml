      description: "<pre>\r\n                {\r\n                    \"DisplayTitle\" : \"Registration with Duplicate Code\"\
        ,\r\n                    \"ews_guid\" : \"6E4840B1-C6C1-47F2-8366-07BAAFE5F358\",\r\n                    \"LongDescription\"\
