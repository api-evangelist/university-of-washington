        in: path
        description: "Optional parameter (made optional by question mark in template).  Duplicate Code allows registration\
          \ of a student in a given section multiple times. \r\n            The duplicate code argument uniquely identifies\
          \ a specific registration record among others within the same course section. For example, an initial registration\
          \ may begin with 'Added to class' (duplicate code blank), but then at a later point may become 'Dropped from class'\
          \ (duplicate code A), followed by a re-registration into the course section 'Added to class' (duplicate code B).\
          \ \r\n            When a registration is transcript-ed(prior quarter) the duplicate codes will often change to a\
          \ numeral(1,2,3...) and many of the original registrations will be removed and replaced with a single transcript\
          \ record. \r\n            Duplicate codes are not serial but often appear to be. They are to be used only to identify\
          \ uniqueness and should not be assumed to represent any business meaning."
