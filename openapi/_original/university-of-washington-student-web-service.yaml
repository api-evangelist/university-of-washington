  /v5/section:
    get:
      tags:
      - Section
      summary: Search for course sections that match the supplied parameters
      description: "<pre>\r\n                 { \r\n                     \"DisplayTitle\" : \"Section Search\",\r\n      \
        \               \"ews_guid\" : \"A5877849-AE6E-409C-BDCE-EA4AAFADD0AC\",\r\n                     \"LongDescription\"\
        \ : \"Search for course sections that match the supplied parameters\",\r\n                     \"ShortDescription\"\
        \ : \"Get a list of course sections\",\r\n                     \"OriginatingSchema\" : [ { \"source\":\"swssdb\" },\
        \ { \"source\":\"uweo\"  }, { \"source\":\"irws\" } ],\r\n                     \"Notes\" : \" This resource requires\
        \ any of the following ASTRA roles:\r\n                                   - sws:Support\r\n                      \
        \             - sws:GradeSubmitter\r\n                                   - sws:UnitReader\r\n                    \
        \             This resource supports the following authentication types:\r\n                                   - X.509\
        \ Certificate\r\n                                   - NetID\r\n                                   - AccessToken\r\n\
        \                                 For the Section_Search resource, the query string parameters can be configured in\
        \ different ways, \r\n                                 depending on the desired results.\r\n                     \
        \            To return a full listing of all the courses and sections in the curriculum, enter the year, quarter,\
        \ \r\n                                 and curriculum abbreviation parameters.\r\n                               \
        \  To return list of sections for a specified course, enter the year, quarter, curriculum abbreviation, \r\n     \
        \                            and the course number parameters.\r\n                                 To return a list\
        \ of all the sections that an instructor is teaching across multiple curricula, \r\n                             \
        \    enter the year, quarter and (instructor) regID parameters.\r\n                                 To return a list\
        \ of all the sections that an instructor is teaching in the specified curriculum, \r\n                           \
        \      enter the year, quarter, curriculum abbreviation and (instructor) regID parameters.\r\n                   \
        \              To return a list of all the sections that a course has been offered at UW, enter the starting year\
        \ \r\n                                 in the year field, leave quarter empty, specify the curriculum abbreviation\
        \ and course number parameters.\r\n                                 To return a list of all the sections that a course\
        \ has been offered at UW but filter them for a specific \r\n                                 set of Delete Flag values,\
        \ enter the starting year in the year field, leave quarter empty, specify \r\n                                 the\
        \ curriculum abbreviation, course number and desired delete flag values.\r\n                                 To return\
        \ a list of all the sections that a course has but exclude courses that do not have sections, \r\n               \
        \                  use the exclude_courses_without_sections flag. To use this mode, you may not also search for future\
        \ terms \r\n                                 at the same time.\",\r\n                     \"Links\" : [\"https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.coursesection\"\
        ],\r\n                     \"Synonyms\" : []\r\n                 }\r\n                 </pre>"
      operationId: SectionSearch
      parameters:
      - name: year
        in: query
        description: 'The 4 digit year.  For example: 2025'
        schema:
          type: string
          default: ''
      - name: quarter
        in: query
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        schema:
          type: string
          default: ''
      - name: future_terms
        in: query
        description: Choose from 0 - 400
        schema:
          type: integer
          format: int32
          default: 0
      - name: curriculum_abbreviation
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: course_number
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: reg_id
        in: query
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned
          to a person by the Identity Registration Service, the authoritative source for person data reconciled from several
          data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer
          to the same person, regardless of name, status or affiliation changes.
        schema:
          type: string
          default: ''
      - name: search_by
        in: query
        description: Choose instructor or gradesubmissiondelegate
        schema:
          type: string
          default: ''
      - name: include_secondaries
        in: query
        description: Choose on or true or false.
        schema:
          type: string
          default: ''
      - name: delete_flag
        in: query
        description: Any combination of active, suspended or withdrawn separated by ,.
        schema:
          type: string
          default: ''
      - name: changed_since_date
        in: query
        description: If you have a value in ChangedSinceDate all other input fields will be ignored and will return all data
          that has changed since the date entered. This is used for applications that only need the changes since they last
          checked without having to know specific details to search by.
        schema:
          type: string
          default: ''
      - name: transcriptable_course
        in: query
        description: "Choose yes, no, or all. If yes then results will include any course that can be creditable such that\
          \ it can be shown on a transcript. This would include certain classes that also fall under the Educational Outreach\
          \ (EO). Yes is also the default value chosen for this search criteria if none is specified.\r\n            If no\
          \ then only classes from EO will be returned.\r\n            If all, both transcriptable and non-transcriptable\
          \ courses will be returned.\r\n            All will return every course regardless of whether it can be included\
          \ in a transcript or not."
        schema:
          type: string
          default: 'yes'
      - name: page_size
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: page_start
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: facility_code
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: room_number
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: sln
        in: query
        description: ''
        schema:
          type: string
          default: ''
      responses:
        '400':
          description: 'Invalid Search for changed since date value | Invalid year | Invalid quarter | Invalid number of future
            terms | Invalid reg id | Invalid search by | Invalid curriculum | Invalid course number | Invalid include secondaries
            | Invalid delete_flag: should be any comma-separated combination of ''active'', ''suspended'', or ''withdrawn''
            | Year and quarter is required when searching by SLN | Invalid input: no secondary sections when filtering by
            delete_flag | year required | Invalid input: either instructor, curriculum, facility code or sln required | Invalid
            input: no secondary sections when filtering by delete_flag | Year and quarter is required when searching by facility
            code | Page start must be an integer greater than 0. | Page size must be an integer between 1 and 500, inclusive.'
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/SectionSearchViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/SectionSearchViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/SectionSearchViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/SectionSearchViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSearchViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/SectionSearchViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
