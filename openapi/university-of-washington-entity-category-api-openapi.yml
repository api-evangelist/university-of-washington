                description: Entity identifier
              category_code:
                type: string
                description: Category code
              category_name:
                type: string
                description: Category name
              source_code:
                type: string
                description: Source code
              source_name:
                type: string
                description: Source name
              expiration:
                type: string
                description: Expiration date
              instance:
                type: string
                description: Instance number
              notify_code:
                type: string
                description: Notification code
              status_code:
                type: string
                description: Status of source record
              status_name:
                type: string
                description: Status of source record
              logname:
                type: string
                description: Last change author
              created:
                type: string
                description: Record created date
              updated:
                type: string
                description: Record last updated date
              post_url:
                type: string
                description: URL to post update
        totalcount:
