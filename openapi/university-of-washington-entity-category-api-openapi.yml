              description: Entity identifier
            category_code:
              type: string
              description: Category code
            source_code:
              type: string
              description: Source code
            instance:
              type: string
              description: Instance number
            notify_code:
              type: string
              description: Notification code
            status_code:
              type: string
              description: Status of source record
      description: Note that the entity.category object can also be presented as an array of exactly one object.
