openapi: 3.2.0
info:
  title: Student Web Service (SWS) Schedule API
  description: Student Web Service (SWS) provides a RESTful API to access and update central student data. Subscribe to http://mailman.u.washington.edu/mailman/listinfo/sws-client-app-dev to get notifications about planned outages, support and the announcement of new features.
  contact:
    name: Enterprise Web Services & Events Team
    url: https://itconnect.uw.edu/service/enterprise-web-services-and-events/
    email: sws-support@uw.edu
  version: v5
servers:
- url: /student
tags:
- name: Schedule
paths:
  /v5/schedule/{reg_id}:
    get:
      tags:
      - Schedule
      summary: Get the schedules associating a student with registered course sections
      description: '{

        "DisplayTitle" : "Student Schedule Search",

        "ews_guid" : "C473DFA9-17C8-4FF8-8505-4043A7535812",

        "LongDescription" : "Schedule provides data associating a student with registered course sections

        for the current term",

        "ShortDescription" : "Search for schedule records for the current term",

        "OriginatingSchema" : [ { "source":"swssdb" }, { "source":"uweo" }, { "source":"irws" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:ScheduleReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID ",

        "Links" : [ ],

        "Synonyms" : []

        }'
      operationId: GetCurrentSchedule
      parameters:
      - name: reg_id
        in: path
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        required: true
        schema:
          maxLength: 32
          minLength: 32
          type: string
      responses:
        '400':
          description: 'Invalid arg: reg ID'
        '404':
          description: No schedule found for reg ID
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/ScheduleViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/ScheduleViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/ScheduleViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/ScheduleViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ScheduleViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v5/schedule/{year},{quarter},{reg_id}:
    get:
      tags:
      - Schedule
      summary: Get the schedules associating a student with registered course sections for the…
      description: '{

        "DisplayTitle" : "Student Schedule by Term",

        "ews_guid" : "23B5A449-6A90-4794-8989-9AD28F33F92B",

        "LongDescription" : "Schedule provides data associating a student with registered course sections for a particular

        year/quarter",

        "ShortDescription" : "Search for schedule records for a particular year/quarter",

        "OriginatingSchema" : [ { "source":"swssdb" }, { "source":"uweo" }, { "source":"irws" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:ScheduleReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID ",

        "Links" : [ ],

        "Synonyms" : []

        }'
      operationId: GetSchedule
      parameters:
      - name: year
        in: path
        description: 'The 4 digit year.  For example: 2025'
        required: true
        schema:
          type: string
      - name: quarter
        in: path
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        required: true
        schema:
          type: string
      - name: reg_id
        in: path
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        required: true
        schema:
          maxLength: 32
          minLength: 32
          type: string
      responses:
        '400':
          description: 'Invalid arg: year | Invalid arg: Year/Quarter must be greater than or equal to the current year/quarter. | Invalid arg: quarter | Invalid arg: Year/Quarter must be greater than or equal to the current year/quarter. | Invalid arg: reg ID'
        '404':
          description: No schedule found for reg ID
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/ScheduleViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/ScheduleViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/ScheduleViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/ScheduleViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ScheduleViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
