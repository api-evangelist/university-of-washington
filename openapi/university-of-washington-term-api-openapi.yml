  /v5/term/{year},{quarter}:
    get:
      tags:
      - Term
      summary: Get the specific term that matches the supplied parameters
      description: '{

        "DisplayTitle" : "Term",

        "ews_guid" : "4457E842-C465-47AA-9E35-B2858FAADCBC",

        "LongDescription" : "Get a specific term matching the supplied parameters",

        "ShortDescription" : "Get a specific term",

        "OriginatingSchema" : [ { "source":"swssdb" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:GradeSubmitter

        - sws:UnitReader

        - sws:AdmReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        - AccessToken

        The term resource describes important dates and times for the academic term.",

        "Links" : [ "https://metadata.uw.edu/Catalog/ViewItem/Term/36884191-96e2-43ea-b6bc-c0dfa138bf9e" ],

        "Synonyms" : []

        }'
      operationId: GetTerm
      parameters:
      - name: year
        in: path
        description: 'The 4 digit year.  For example: 2025'
        required: true
        schema:
          maxLength: 4
          minLength: 4
          type: string
      - name: quarter
        in: path
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        required: true
        schema:
          maxLength: 6
          minLength: 6
          type: string
      responses:
        '400':
          description: 'Invalid arg: year | Invalid arg: quarter'
        '404':
          description: Term not found.
        '500':
          description: Term is null or empty. | InternalServerError
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/TermViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/TermViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/TermViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/TermViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/TermViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/TermViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '503':
          description: ServiceUnavailable
components:
