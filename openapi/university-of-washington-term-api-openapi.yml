openapi: 3.2.0
info:
  title: Student Web Service (SWS) Term API
  description: Student Web Service (SWS) provides a RESTful API to access and update central student data. Subscribe to http://mailman.u.washington.edu/mailman/listinfo/sws-client-app-dev to get notifications about planned outages, support and the announcement of new features.
  contact:
    name: Enterprise Web Services & Events Team
    url: https://itconnect.uw.edu/service/enterprise-web-services-and-events/
    email: sws-support@uw.edu
  version: v5
servers:
- url: /student
tags:
- name: Term
paths:
  /v5/term/current:
    get:
      tags:
      - Term
      summary: Get the current term
      description: '{

        "DisplayTitle" : "Term (Current)",

        "ews_guid" : "AC24C6B9-5259-4DB6-A9E8-AA05013DA0A9",

        "LongDescription" : "Get the current term. It is often a starting point to accessing other term based resources.",

        "ShortDescription" : "Get the current term ",

        "OriginatingSchema" : [ { "source":"swssdb" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:GradeSubmitter

        - sws:UnitReader

        - sws:AdmReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        - AccessToken

        The term resource describes important dates and times for the academic term.",

        "Links" : [ "https://metadata.uw.edu/Catalog/ViewItem/Term/36884191-96e2-43ea-b6bc-c0dfa138bf9e" ],

        "Synonyms" : []

        }'
      operationId: GetTermCurrent
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/TermViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/TermViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/TermViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/TermViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/TermViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/TermViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
