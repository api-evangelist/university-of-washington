openapi: 3.2.0
info:
  title: IdCard Web Service (IdCardWS) Photo API
  description: IdCard Web Service (IdCardWS) provides a RESTful API to UW IdCard data. Subscribe to http://mailman.u.washington.edu/mailman/listinfo/idcardws-users to get notifications about planned outages, support and the announcement of new features.
  contact:
    name: Enterprise Web Services & Events Team
    url: https://itconnect.uw.edu/service/enterprise-web-services-and-events/
    email: idcardws-support@uw.edu
  version: v1
servers:
- url: /idcard
tags:
- name: Photo
paths:
  /v1/photo/{reg_Id}:
    get:
      tags:
      - Photo
      summary: Get the Id card photo (image/jpeg) for the indicated person
      operationId: Photo
      parameters:
      - name: reg_Id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v1/photo/{reg_Id}.{file_extension}:
    get:
      tags:
      - Photo
      summary: Get the Id card photo (image/jpeg) for the indicated person
      operationId: PhotoWithExtension
      parameters:
      - name: reg_Id
        in: path
        required: true
        schema:
          type: string
      - name: file_extension
        in: path
        description: 'Accepted values: jpg'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v1/photo:
    get:
      tags:
      - Photo
      operationId: PhotoSearch
      parameters:
      - name: reg_id
        in: query
        schema:
          type: string
          default: ''
      - name: net_id
        in: query
        schema:
          type: string
          default: ''
      - name: student_number
        in: query
        schema:
          type: string
          default: ''
      - name: employee_id
        in: query
        schema:
          type: string
          default: ''
      - name: height
        in: query
        schema:
          type: string
          default: ''
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/PhotoSearchViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/PhotoSearchViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/PhotoSearchViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/PhotoSearchViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoSearchViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/PhotoSearchViewModel'
        '400':
          description: Bad Request
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
      summary: Photo search
      x-summary-source: derived
components:
  schemas:
    PhotoResourceUri:
      type: object
      properties:
        viewFormat:
          $ref: '#/components/schemas/ViewFormats'
        href:
          type:
          - string
          - 'null'
        uriAppender:
          type:
          - string
          - 'null'
        fileExtension:
          type:
          - string
          - 'null'
        height:
          type:
          - integer
          - 'null'
          format: int32
        regId:
          type:
          - string
          - 'null'
      additionalProperties: false
    PhotoSearchResourceUri:
      type: object
      properties:
        href:
          type:
          - string
          - 'null'
        regId:
          type:
          - string
          - 'null'
        netId:
          type:
          - string
          - 'null'
        studentNumber:
          type:
          - string
          - 'null'
        employeeId:
          type:
          - string
          - 'null'
        height:
          type:
          - string
          - 'null'
        viewFormat:
          $ref: '#/components/schemas/ViewFormats'
      additionalProperties: false
    ViewFormats:
      enum:
      - 1
      - 2
      - 3
      - 5
      type: integer
      format: int32
    PhotoSearchViewModel:
      type: object
      properties:
        metadata:
          type:
          - string
          - 'null'
        pageCount:
          type:
          - string
          - 'null'
          description: 'Actual number of records on the current search results page. This must be set by the view in order

            for paging to work.'
        previousPageStart:
          type:
          - string
          - 'null'
          description: The counter value for the start of the previous search results page.
          readOnly: true
        pageSize:
          type:
          - string
          - 'null'
          description: Requested number of records for the current search results page.
        pageStart:
          type:
          - string
          - 'null'
          description: The counter value for the start of the current search results page.
        nextPageStart:
          type:
          - string
          - 'null'
          description: The counter value for the start of the next search results page.
          readOnly: true
        totalCount:
          type: integer
          format: int32
        pageStartOffset:
          type: integer
          description: 'The page start offset. Since sources are generally 0 based and the view

            defaults to 1 based, our offset defaults to -1.'
          format: int32
        format:
          $ref: '#/components/schemas/ViewFormats'
        searchResultsCount:
          type: integer
          format: int32
          readOnly: true
        photos:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PhotoViewModel'
          readOnly: true
        title:
          type:
          - string
          - 'null'
          readOnly: true
        current:
          $ref: '#/components/schemas/PhotoSearchResourceUri'
      additionalProperties: false
    PhotoViewModel:
      type: object
      properties:
        metadata:
          type:
          - string
          - 'null'
        pageCount:
          type:
          - string
          - 'null'
          description: 'Actual number of records on the current search results page. This must be set by the view in order

            for paging to work.'
        previousPageStart:
          type:
          - string
          - 'null'
          description: The counter value for the start of the previous search results page.
          readOnly: true
        pageSize:
          type:
          - string
          - 'null'
          description: Requested number of records for the current search results page.
        pageStart:
          type:
          - string
          - 'null'
          description: The counter value for the start of the current search results page.
        nextPageStart:
          type:
          - string
          - 'null'
          description: The counter value for the start of the next search results page.
          readOnly: true
        totalCount:
          type: integer
          format: int32
        pageStartOffset:
          type: integer
          description: 'The page start offset. Since sources are generally 0 based and the view

            defaults to 1 based, our offset defaults to -1.'
          format: int32
        format:
          $ref: '#/components/schemas/ViewFormats'
        nameAndRegID:
          type:
          - string
          - 'null'
          readOnly: true
        fullName:
          type:
          - string
          - 'null'
          readOnly: true
        regId:
          type:
          - string
          - 'null'
          readOnly: true
        fileExtension:
          type:
          - string
          - 'null'
          readOnly: true
        height:
          type:
          - integer
          - 'null'
          format: int32
          readOnly: true
        small:
          $ref: '#/components/schemas/PhotoResourceUri'
        medium:
          $ref: '#/components/schemas/PhotoResourceUri'
        large:
          $ref: '#/components/schemas/PhotoResourceUri'
        customHeight:
          $ref: '#/components/schemas/PhotoResourceUri'
      additionalProperties: false
