openapi: 3.2.0
info:
  title: Student Web Service (SWS) Section API
  description: Student Web Service (SWS) provides a RESTful API to access and update central student data. Subscribe to http://mailman.u.washington.edu/mailman/listinfo/sws-client-app-dev to get notifications about planned outages, support and the announcement of new features.
  contact:
    name: Enterprise Web Services & Events Team
    url: https://itconnect.uw.edu/service/enterprise-web-services-and-events/
    email: sws-support@uw.edu
  version: v5
servers:
- url: /student
tags:
- name: Section
paths:
  /v5/course/{year},{quarter},{curriculum_abbreviation},{course_number}/{section_id}:
    get:
      tags:
      - Section
      summary: Get a course section offered in the year/quarter
      description: '{

        "DisplayTitle" : "Section",

        "ews_guid" : "17D4611C-D94A-478C-95CD-EAB4B7E37FAE",

        "LongDescription" : "A resource to retrieve a specific course section of a course offered in the year/quarter

        for the specified curriculum",

        "ShortDescription" : "Get a specific course section",

        "OriginatingSchema" : [ { "source":"swssdb" }, { "source":"uweo" }, { "source":"irws" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:GradeSubmitter

        - sws:UnitReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        - AccessToken ",

        "Links" : ["https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.coursesection"],

        "Synonyms" : []

        }'
      operationId: GetSection
      parameters:
      - name: year
        in: path
        description: 'The 4 digit year.  For example: 2025'
        required: true
        schema:
          type: string
      - name: quarter
        in: path
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        required: true
        schema:
          type: string
      - name: curriculum_abbreviation
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: course_number
        in: path
        description: ''
        required: true
        schema:
          type: string
      - name: section_id
        in: path
        description: ''
        required: true
        schema:
          maxLength: 2
          minLength: 1
          type: string
      responses:
        '400':
          description: 'Invalid arg: year | Invalid arg: quarter | Invalid arg: curriculum abbreviation | Invalid arg: course number | Invalid arg: section ID'
        '404':
          description: No section found.
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/SectionViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/SectionViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/SectionViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/SectionViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/SectionViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/SectionViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v5/section:
    get:
      tags:
      - Section
      summary: Search for course sections that match the supplied parameters
      description: '{

        "DisplayTitle" : "Section Search",

        "ews_guid" : "A5877849-AE6E-409C-BDCE-EA4AAFADD0AC",

        "LongDescription" : "Search for course sections that match the supplied parameters",

        "ShortDescription" : "Get a list of course sections",

        "OriginatingSchema" : [ { "source":"swssdb" }, { "source":"uweo" }, { "source":"irws" } ],

        "Notes" : " This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:GradeSubmitter

        - sws:UnitReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        - AccessToken

        For the Section_Search resource, the query string parameters can be configured in different ways,

        depending on the desired results.

        To return a full listing of all the courses and sections in the curriculum, enter the year, quarter,

        and curriculum abbreviation parameters.

        To return list of sections for a specified course, enter the year, quarter, curriculum abbreviation,

        and the course number parameters.

        To return a list of all the sections that an instructor is teaching across multiple curricula,

        enter the year, quarter and (instructor) regID parameters.

        To return a list of all the sections that an instructor is teaching in the specified curriculum,

        enter the year, quarter, curriculum abbreviation and (instructor) regID parameters.

        To return a list of all the sections that a course has been offered at UW, enter the starting year

        in the year field, leave quarter empty, specify the curriculum abbreviation and course number parameters.

        To return a list of all the sections that a course has been offered at UW but filter them for a specific

        set of Delete Flag values, enter the starting year in the year field, leave quarter empty, specify

        the curriculum abbreviation, course number and desired delete flag values.

        To return a list of all the sections that a course has but exclude courses that do not have sections,

        use the exclude_courses_without_sections flag. To use this mode, you may not also search for future terms

        at the same time.",

        "Links" : ["https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.coursesection"],

        "Synonyms" : []

        }'
      operationId: SectionSearch
      parameters:
      - name: year
        in: query
        description: 'The 4 digit year.  For example: 2025'
        schema:
          type: string
          default: ''
      - name: quarter
        in: query
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        schema:
          type: string
          default: ''
      - name: future_terms
        in: query
        description: Choose from 0 - 400
        schema:
          type: integer
          format: int32
          default: 0
      - name: curriculum_abbreviation
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: course_number
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: reg_id
        in: query
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        schema:
          type: string
          default: ''
      - name: search_by
        in: query
        description: Choose instructor or gradesubmissiondelegate
        schema:
          type: string
          default: ''
      - name: include_secondaries
        in: query
        description: Choose on or true or false.
        schema:
          type: string
          default: ''
      - name: delete_flag
        in: query
        description: Any combination of active, suspended or withdrawn separated by ,.
        schema:
          type: string
          default: ''
      - name: changed_since_date
        in: query
        description: If you have a value in ChangedSinceDate all other input fields will be ignored and will return all data that has changed since the date entered. This is used for applications that only need the changes since they last checked without having to know specific details to search by.
        schema:
          type: string
          default: ''
      - name: transcriptable_course
        in: query
        description: "Choose yes, no, or all. If yes then results will include any course that can be creditable such that it can be shown on a transcript. This would include certain classes that also fall under the Educational Outreach (EO). Yes is also the default value chosen for this search criteria if none is specified.\n            If no then only classes from EO will be returned.\n            If all, both transcriptable and non-transcriptable courses will be returned.\n            All will return every course regardless of whether it can be included in a transcript or not."
        schema:
          type: string
          default: 'yes'
      - name: page_size
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: page_start
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: facility_code
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: room_number
        in: query
        description: ''
        schema:
          type: string
          default: ''
      - name: sln
        in: query
        description: ''
        schema:
          type: string
          default: ''
      responses:
        '400':
          description: 'Invalid Search for changed since date value | Invalid year | Invalid quarter | Invalid number of future terms | Invalid reg id | Invalid search by | Invalid curriculum | Invalid course number | Invalid include secondaries | Invalid delete_flag: should be any comma-separated combination of ''active'', ''suspended'', or ''withdrawn'' | Year and quarter is required when searching by SLN | Invalid input: no secondary sections when filtering by delete_flag | year required | Invalid input: either instructor, curriculum, facility code or sln required | Invalid input: no secondary sections when filtering by delete_flag | Year and quarter is required when searching by facility code | Page start must be an integer greater than 0. | Page size must be an integer between 1 and 500, inclusive.'
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/SectionSearchViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/SectionSearchViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/SectionSearchViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/SectionSearchViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSearchViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/SectionSearchViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v5/section/{year},{quarter}:
    get:
      tags:
      - Section
      summary: Get course sections offered in the year/quarter
      description: '{

        "DisplayTitle" : "Section Search by Term",

        "ews_guid" : "EC0A49F3-5969-4020-81CA-924BCA67E7AB",

        "LongDescription" : "A resource to retrieve a list of course sections offered in the year/quarter.",

        "ShortDescription" : "Search for all course sections by term",

        "OriginatingSchema" : [ { "source":"swssdb" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:GradeSubmitter

        - sws:UnitReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        - AccessToken ",

        "Links" : ["https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.coursesection"],

        "Synonyms" : []

        }'
      operationId: SectionTermSearch
      parameters:
      - name: year
        in: path
        description: 'The 4 digit year.  For example: 2025'
        required: true
        schema:
          maxLength: 4
          minLength: 4
          type: string
          default: ''
      - name: quarter
        in: path
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        required: true
        schema:
          maxLength: 6
          minLength: 6
          type: string
          default: ''
      - name: page_size
        in: query
        description: ''
        schema:
          type: string
          default: '1000'
      - name: page_start
        in: query
        description: ''
        schema:
          type: string
          default: ''
      responses:
        '400':
          description: Section Term search does not support paging of less then 500 sections per request.
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/SectionTermSearchViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/SectionTermSearchViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/SectionTermSearchViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/SectionTermSearchViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/SectionTermSearchViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/SectionTermSearchViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v5/course/{year},{quarter},{curriculum_abbreviation},{course_number}/{section_id}/status:
