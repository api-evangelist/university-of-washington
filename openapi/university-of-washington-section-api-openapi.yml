components:
  schemas:
    FinalExamBuildingUri:
      type: object
      properties:
        Href:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Final Exam Building Uri\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Section\"}]\n}"
    OnlineLearningTypeViewModel:
      type: object
      properties:
        Code:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.sect.oltpcd\" }\n                ],\n                \"TechnicalDescription\": \"Online learning type code\"\n            }\n            </pre>"
        Description:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.sect.oltp\" }\n                ],\n                \"TechnicalDescription\": \"Online learning type description\"\n            }\n            </pre>"
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Online Learning Type Model\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Section\"}]\n}"
    LinkedSectionTypeViewModel:
      type: object
      properties:
        LinkedSections:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/LinkedSectionViewModel'
        Type:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.sect.ltp\" }\n                ],\n                \"TechnicalDescription\": \"Linked section type\"\n            }\n            </pre>"
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Linked Section Type Model\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Section\"}]\n}"
    PersonResourceUri:
      type: object
      properties:
        Name:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"IRWS.identity.uwPersonPrefferredName\" },\n                    { \"source\":\"IRWS.identity.uwPersonRegisteredName\" }\n                ],\n                \"TechnicalDescription\": \"This field is resource specific\"\n            }\n            </pre>"
        RegID:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"IRWS.identity.regid\" }\n                ],\n                \"TechnicalDescription\": \"UW Registration ID. This field is resource specific\"\n            }\n            </pre>"
        Pronouns:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"IRWS.identity.uwPersonPronoun\" }\n                ],\n                \"TechnicalDescription\": \"\"\n            }\n            </pre>"
        Href:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Person Resource URI\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Person\"}],\n    \"TargetOperationId\" : [\"GetPerson\"]\n}"
    RegistrationSearchUri:
      type: object
      properties:
        Year:
          type: integer
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sys_tbl_39_calendar.table_key\" }\n                ],\n                \"TechnicalDescription\": \"Year\"\n            }\n            </pre>"
          format: int32
        Quarter:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sys_tbl_39_calendar.table_key\" }\n                ],\n                \"TechnicalDescription\": \"Quarter consists of winter, spring, summer, and autumn.\"\n            }\n            </pre>"
        RegID:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.fac.fsqn\" },\n                    { \"source\":\"UWEO.selSWSCourseSections.InstructorIndex\"}\n                ],\n                \"TechnicalDescription\": \"Faculty sequence number\"\n            }\n            </pre>"
        SectionID:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.sect.csid\" },\n                    { \"source\":\"UWEO.selSWSCourseSections.SectionID\"}\n                ],\n                \"TechnicalDescription\": \"Section ID\"\n            }\n            </pre>"
        IsActive:
          type: boolean
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"url\" }\n                ],\n                \"TechnicalDescription\": \"Is active flag\"\n            }\n            </pre>"
        Verbose:
          type: boolean
        CurriculumAbbreviation:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.sect.dept\" }\n                ],\n                \"TechnicalDescription\": \"Curriculum abbreviation\"\n            }\n            </pre>"
        CourseNumber:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.sect.crsn\" }\n                ],\n                \"TechnicalDescription\": \"Course number\"\n            }\n            </pre>"
        InstructorRegID:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"url\" }\n                ],\n                \"TechnicalDescription\": \"Always set to null\"\n            }\n            </pre>"
        ChangedSinceDate:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"url\" }\n                ],\n                \"TechnicalDescription\": \"Always empty string\"\n            }\n            </pre>"
        TranscriptableCourse:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"url\" }\n                ],\n                \"TechnicalDescription\": \"Always empty string\"\n            }\n            </pre>"
        PageStart:
          type:
          - string
          - 'null'
        PageSize:
          type:
          - string
          - 'null'
        Href:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Registration Search URI\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Section_Registration\"}],\n    \"TargetOperationId\" : [\"RegistrationSearch\"]\n}"
    MeetingBuildingUri:
      type: object
      properties:
        Href:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Meeting Building URI\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Section\"}]\n}"
    MeetingViewModel:
      type: object
      properties:
        MeetingIndex:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.mt.ndx\" },\n                    { \"source\":\"UWEO.selSWSCourseSections.MeetingIndex\"}\n                ],\n                \"TechnicalDescription\": \"Meeting number\"\n            }\n            </pre>"
        MeetingType:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.mt.tp\" },\n                    { \"source\":\"UWEO.selSWSCourseSections.MeetingType\"}\n                ],\n                \"TechnicalDescription\": \"Meeting type\"\n            }\n            </pre>"
