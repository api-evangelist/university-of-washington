components:
  schemas:
    EntityProfileRecoveryPostPayload:
      type: object
      properties:
        entity.profile.recovery:
          type: object
          description: Entity.profile.recovery object.  See supplemental docs for exact attributes.
          properties:
            validid:
              type: string
              description: Entity identifier
            recover_contacts:
              type: array
              description: List of recovery contacts
              items:
                type: object
                properties:
                  type:
                    type: string
                    description: Contact type
                  value:
                    type: string
                    description: Contact data
                  validation_date:
                    type: string
                    description: Date contact was validated
            recovery_block_reasons:
              type: array
              description: List of reasons
              items:
                type: string
                description: Reason to block recovery
      description: Note that the entity.profile.recovery object can also be presented as an array of exactly one object.
    EntityProfileRecoveryPostResult:
      type: object
      properties:
        entity.profile.recovery:
          type: array
          description: Response to POST
          items:
            type: object
            properties:
              count:
                type: string
                description: Number of records affected
              message:
                type: string
                description: Result of operation (usually 'recovery set')
    GenericError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    EntityProfileRecoveryGetResult:
      type: object
      properties:
        entity.profile.recovery:
          type: array
          description: Array of entity.profile.recovery objects
          items:
            type: object
            properties:
              validid:
                type: string
                description: Entity identifier
              recover_contacts:
                type: array
                description: List of recovery contacts
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      description: Contact type
                    value:
                      type: string
                      description: Contact data
                    validation_date:
                      type: string
                      description: Date contact was validated
              recovery_block_reasons:
                type: array
                description: List of reasons
                items:
                  type: string
                  description: Reason to block recovery
              logname:
                type: string
                description: Last change author
              updated:
                type: string
                description: Record last updated date
              post_url:
                type: string
                description: URL to post update
        totalcount:
          type: integer
          description: Number of entity.profile.recovery objects returned
