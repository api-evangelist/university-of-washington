openapi: 3.0.1
info:
  title: IdCard Web Service (IdCardWS) Campus Enrollment API
  description: IdCard Web Service (IdCardWS) provides a RESTful API to UW IdCard data. Subscribe to http://mailman.u.washington.edu/mailman/listinfo/idcardws-users to get notifications about planned outages, support and the announcement of new features.
  contact:
    name: Enterprise Web Services & Events Team
    url: https://itconnect.uw.edu/service/enterprise-web-services-and-events/
    email: idcardws-support@uw.edu
  version: v1
servers:
- url: /idcard
tags:
- name: Enrollment
paths:
  /v5/enrollment/{year},{quarter},{reg_id}:
    get:
      tags:
      - Enrollment
      summary: Get a specific enrollment
      description: "<pre>\r\n                 {\r\n                     \"DisplayTitle\" : \"Enrollment Search\",\r\n                     \"ews_guid\" : \"7D3E229D-2513-48D1-9760-BA7D587288C8\",\r\n                     \"LongDescription\" : \"Display information about a specific enrollment\",\r\n                     \"ShortDescription\" : \"Enrollment information\",\r\n                     \"OriginatingSchema\" : [ { \"source\":\"swssdb\" }, { \"source\":\"uweo\" }, { \"source\":\"irws\" } ],\r\n                     \"Notes\" : \"This resource requires any of the following ASTRA roles:\r\n                                  - sws:Support\r\n                                  - sws:GradeSubmitter\r\n                                  - sws:GradeReader\r\n                                  - sws:UnitReader\r\n                                This resource supports the following authentication types:\r\n                                  - X.509 Certificate\r\n                                  - NetID\r\n                                The verbose flag chooses a full representation or the standard representation.\",\r\n                     \"Links\" : [ \"https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.enrolledstudent\", \r\n                                 \"https://metadata.uw.edu/Catalog/ViewItem/Term/79542d58-fb29-40f7-addb-df2638759804\" ],\r\n                     \"Synonyms\" : []\r\n                 }\r\n                 </pre>"
      operationId: GetEnrollment
      parameters:
      - name: year
        in: path
        description: 'The 4 digit year.  For example: 2025'
        required: true
        schema:
          maxLength: 4
          minLength: 4
          type: string
      - name: quarter
        in: path
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        required: true
        schema:
          maxLength: 6
          minLength: 6
          type: string
      - name: reg_id
        in: path
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        required: true
        schema:
          maxLength: 32
          minLength: 32
          type: string
      - name: transcriptable_course
        in: query
        description: "Choose yes, no, or all. If yes then results will include any course that can be creditable such that it can be shown on a transcript. This would include certain classes that also fall under the Educational Outreach (EO). Yes is also the default value chosen for this search criteria if none is specified.\r\n            If no then only classes from EO will be returned.\r\n            If all, both transcriptable and non-transcriptable courses will be returned.\r\n            All will return every course regardless of whether it can be included in a transcript or not."
        schema:
          type: string
          default: 'yes'
      - name: verbose
        in: query
        description: Choose on or true to enable.  Otherwise off or false.
        schema:
          type: string
          default: ''
      responses:
        '400':
          description: 'Invalid arg: year | Invalid arg: quarter | Invalid arg: regid | Invalid verbose value'
        '404':
          description: No enrollment found.
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/EnrollmentViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/EnrollmentViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/EnrollmentViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/EnrollmentViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/EnrollmentViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v5/enrollment:
    get:
      tags:
      - Enrollment
      summary: Search for enrollments that match the supplied parameters
      description: "<pre>\r\n                 {\r\n                     \"DisplayTitle\" : \"Enrollment\",\r\n                     \"ews_guid\" : \"71A7F163-1585-4970-91FF-F543363264A4\",\r\n                     \"LongDescription\" : \"Search for enrollments filtered by regid, change since date and transcriptable course flag\",\r\n                     \"ShortDescription\" : \"Search for enrollments\",\r\n                     \"OriginatingSchema\" : [ { \"source\":\"swssdb\" }, { \"source\":\"uweo\" }, { \"source\":\"irws\" } ],\r\n                     \"Notes\" : \"This resource requires any of the following ASTRA roles:\r\n                                  - sws:Support\r\n                                  - sws:GradeSubmitter\r\n                                  - sws:GradeReader\r\n                                  - sws:UnitReader\r\n                                This resource supports the following authentication types:\r\n                                  - X.509 Certificate\r\n                                  - NetID\r\n                                The verbose flag chooses a full representation or the standard representation.\",\r\n                     \"Links\" : [ \"https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.enrolledstudent\" ],\r\n                     \"Synonyms\" : []\r\n                 }\r\n                 </pre>"
      operationId: EnrollmentSearchFull
      parameters:
      - name: changed_since_date
        in: query
        description: If you have a value in ChangedSinceDate all other input fields will be ignored and will return all data that has changed since the date entered. This is used for applications that only need the changes since they last checked without having to know specific details to search by.
        schema:
          type: string
          default: ''
      - name: reg_id
        in: query
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        schema:
          type: string
          default: ''
      - name: verbose
        in: query
        description: Choose on or true to enable.  Otherwise off or false.
        schema:
          type: string
          default: ''
      - name: transcriptable_course
        in: query
        description: "Choose yes, no, or all. If yes then results will include any course that can be creditable such that it can be shown on a transcript. This would include certain classes that also fall under the Educational Outreach (EO). Yes is also the default value chosen for this search criteria if none is specified.\r\n            If no then only classes from EO will be returned.\r\n            If all, both transcriptable and non-transcriptable courses will be returned.\r\n            All will return every course regardless of whether it can be included in a transcript or not."
        schema:
          type: string
          default: 'yes'
      responses:
        '400':
          description: 'Invalid arg: year | Invalid arg: quarter | Invalid arg: regid | Invalid verbose value'
        '404':
          description: No enrollment found.
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/EnrollmentSearchFullViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/EnrollmentSearchFullViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/EnrollmentSearchFullViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/EnrollmentSearchFullViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentSearchFullViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/EnrollmentSearchFullViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
components:
