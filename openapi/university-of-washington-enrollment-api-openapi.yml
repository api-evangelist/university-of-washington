          nullable: true
        HonorsProgram:
          type: boolean
          description: "<pre>\r\n            {\r\n                \"OriginatingSchema\" : [\r\n                    { \"source\":\"SWSSDB.transcript.honors_program\" },\r\n                    { \"source\":\"SWSSDB.registration.regis_hnrs_prg\" },\r\n                    { \"source\":\"SWSSDB.student_1.honors_program\" }\r\n                ],\r\n                \"TechnicalDescription\": \"Honors program. If transcripts not posted, then this value is dependent on pending_hnrs_prg\"\r\n            }\r\n            </pre>"
        LeaveEndQuarter:
          type: integer
          description: "<pre>\r\n            {\r\n                \"OriginatingSchema\" : [\r\n                    { \"source\":\"SWSSDB.transcript.leave_ends_qtr\" }\r\n                ],\r\n                \"TechnicalDescription\": \"Leave End Quarter. Null if transcripts not posted\"\r\n            }\r\n            </pre>"
          format: int32
        LeaveEndYear:
