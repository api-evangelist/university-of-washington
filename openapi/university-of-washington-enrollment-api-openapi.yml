          nullable: true
        ClassCode:
          type: string
          description: "<pre>\r\n            {\r\n                \"OriginatingSchema\" : [\r\n                    { \"source\":\"SWSSDB.transcript.class\" },\r\n                    { \"source\":\"SWSSDB.registration.regis_class\" },\r\n                    { \"source\":\"SWSSDB.student_1.class\" }\r\n                ],\r\n                \"TechnicalDescription\": \"Class code. If transcripts not posted, then this value is dependent on pending_class\"\r\n            }\r\n            </pre>"
          nullable: true
        ClassDescription:
