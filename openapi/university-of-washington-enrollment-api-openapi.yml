openapi: 3.2.0
info:
  title: Student Web Service (SWS) Enrollment API
  description: Student Web Service (SWS) provides a RESTful API to access and update central student data. Subscribe to http://mailman.u.washington.edu/mailman/listinfo/sws-client-app-dev to get notifications about planned outages, support and the announcement of new features.
  contact:
    name: Enterprise Web Services & Events Team
    url: https://itconnect.uw.edu/service/enterprise-web-services-and-events/
    email: sws-support@uw.edu
  version: v5
servers:
- url: /student
tags:
- name: Enrollment
paths:
  /v5/enrollment/{year},{quarter},{reg_id}:
    get:
      tags:
      - Enrollment
      summary: Get a specific enrollment
      description: '{

        "DisplayTitle" : "Enrollment Search",

        "ews_guid" : "7D3E229D-2513-48D1-9760-BA7D587288C8",

        "LongDescription" : "Display information about a specific enrollment",

        "ShortDescription" : "Enrollment information",

        "OriginatingSchema" : [ { "source":"swssdb" }, { "source":"uweo" }, { "source":"irws" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:GradeSubmitter

        - sws:GradeReader

        - sws:UnitReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        The verbose flag chooses a full representation or the standard representation.",

        "Links" : [ "https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.enrolledstudent",

        "https://metadata.uw.edu/Catalog/ViewItem/Term/79542d58-fb29-40f7-addb-df2638759804" ],

        "Synonyms" : []

        }'
      operationId: GetEnrollment
      parameters:
      - name: year
        in: path
        description: 'The 4 digit year.  For example: 2025'
        required: true
        schema:
          maxLength: 4
          minLength: 4
          type: string
      - name: quarter
        in: path
        description: 'The 1 digit quarter.  For example: 0=Default, 1=winter, 2=spring, 3=summer, 4=autumn'
        required: true
        schema:
          maxLength: 6
          minLength: 6
          type: string
      - name: reg_id
        in: path
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        required: true
        schema:
          maxLength: 32
          minLength: 32
          type: string
      - name: transcriptable_course
        in: query
        description: "Choose yes, no, or all. If yes then results will include any course that can be creditable such that it can be shown on a transcript. This would include certain classes that also fall under the Educational Outreach (EO). Yes is also the default value chosen for this search criteria if none is specified.\n            If no then only classes from EO will be returned.\n            If all, both transcriptable and non-transcriptable courses will be returned.\n            All will return every course regardless of whether it can be included in a transcript or not."
        schema:
          type: string
          default: 'yes'
      - name: verbose
        in: query
        description: Choose on or true to enable.  Otherwise off or false.
        schema:
          type: string
          default: ''
      responses:
        '400':
          description: 'Invalid arg: year | Invalid arg: quarter | Invalid arg: regid | Invalid verbose value'
        '404':
          description: No enrollment found.
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/EnrollmentViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/EnrollmentViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/EnrollmentViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/EnrollmentViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/EnrollmentViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
  /v5/enrollment:
    get:
      tags:
      - Enrollment
      summary: Search for enrollments that match the supplied parameters
      description: '{

        "DisplayTitle" : "Enrollment",

        "ews_guid" : "71A7F163-1585-4970-91FF-F543363264A4",

        "LongDescription" : "Search for enrollments filtered by regid, change since date and transcriptable course flag",

        "ShortDescription" : "Search for enrollments",

        "OriginatingSchema" : [ { "source":"swssdb" }, { "source":"uweo" }, { "source":"irws" } ],

        "Notes" : "This resource requires any of the following ASTRA roles:

        - sws:Support

        - sws:GradeSubmitter

        - sws:GradeReader

        - sws:UnitReader

        This resource supports the following authentication types:

        - X.509 Certificate

        - NetID

        The verbose flag chooses a full representation or the standard representation.",

        "Links" : [ "https://metadata.uw.edu/Catalog/ViewItem/Term/studentdata.enrolledstudent" ],

        "Synonyms" : []

        }'
      operationId: EnrollmentSearchFull
      parameters:
      - name: changed_since_date
        in: query
        description: If you have a value in ChangedSinceDate all other input fields will be ignored and will return all data that has changed since the date entered. This is used for applications that only need the changes since they last checked without having to know specific details to search by.
        schema:
          type: string
          default: ''
      - name: reg_id
        in: query
        description: RegIDs are the authoritative unique IDs guaranteed to identify a UW person permanently.  RegIDs are assigned to a person by the Identity Registration Service, the authoritative source for person data reconciled from several data sources which may represent multiple records and accounts for a single person.  A given RegID will always refer to the same person, regardless of name, status or affiliation changes.
        schema:
          type: string
          default: ''
      - name: verbose
        in: query
        description: Choose on or true to enable.  Otherwise off or false.
        schema:
          type: string
          default: ''
      - name: transcriptable_course
        in: query
        description: "Choose yes, no, or all. If yes then results will include any course that can be creditable such that it can be shown on a transcript. This would include certain classes that also fall under the Educational Outreach (EO). Yes is also the default value chosen for this search criteria if none is specified.\n            If no then only classes from EO will be returned.\n            If all, both transcriptable and non-transcriptable courses will be returned.\n            All will return every course regardless of whether it can be included in a transcript or not."
        schema:
          type: string
          default: 'yes'
      responses:
        '400':
          description: 'Invalid arg: year | Invalid arg: quarter | Invalid arg: regid | Invalid verbose value'
        '404':
          description: No enrollment found.
        '200':
          description: OK
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/EnrollmentSearchFullViewModel'
            application/xml:
              schema:
                $ref: '#/components/schemas/EnrollmentSearchFullViewModel'
            text/xml:
              schema:
                $ref: '#/components/schemas/EnrollmentSearchFullViewModel'
            text/plain:
              schema:
                $ref: '#/components/schemas/EnrollmentSearchFullViewModel'
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentSearchFullViewModel'
            text/json:
              schema:
                $ref: '#/components/schemas/EnrollmentSearchFullViewModel'
        '202':
          description: Accepted
        '301':
          description: MovedPermanently
        '302':
          description: Found
        '304':
          description: NotModified
        '401':
          description: Identity '{identity}' is not authorized to access this resource.
        '405':
          description: MethodNotAllowed
        '500':
          description: InternalServerError
        '503':
          description: ServiceUnavailable
components:
  schemas:
    TermResourceUri:
      type: object
      properties:
        Href:
          type:
          - string
          - 'null'
        Year:
          type: integer
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_major_code.major_last_yr\" },\n                    { \"source\":\"SWSSDB.sr_major_code.major_first_yr\" },\n                    { \"source\":\"SWSSDB.sys_tbl_39_calendar.table_key\" },\n                    { \"source\":\"SWSSDB.student_1.last_yr_enrolled\" },\n                    { \"source\":\"SDB.SWI610.trm/yr\" },\n                    { \"source\":\"SWSSDB.sr_course_titles.first_eff_yr\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.FirstEffectiveTerm/Year\"}\n                ],\n                \"TechnicalDescription\": \"Year for the given term\"\n            }\n            </pre>"
          format: int32
        Quarter:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_major_code.major_last_qtr\" },\n                    { \"source\":\"SWSSDB.sr_major_code.major_first_qtr\" },\n                    { \"source\":\"SWSSDB.sys_tbl_39_calendar.table_key\" },\n                    { \"source\":\"SWSSDB.student_1.last_qtr_enrolled\" },\n                    { \"source\":\"SDB.SWI610.trm/qtr\" },\n                    { \"source\":\"SWSSDB.sr_course_titles.first_eff_qtr\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.FirstEffectiveTerm/Quarter\"}\n                ],\n                \"TechnicalDescription\": \"Quarter for the given term\"\n            }\n            </pre>"
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Term Resource URI\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Term\"}],\n    \"TargetOperationId\" : [\"GetTerm\"]\n}"
    SectionResourceUri:
      type: object
      properties:
        Href:
          type:
          - string
          - 'null'
        Year:
          type: integer
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration_courses.regis_yr\" },\n                    { \"source\":\"SWSSDB.transcript_courses_taken.tran_yr\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.Year\"},\n                    { \"source\":\"SDB.SWI202.trm.yr\" }\n                ],\n                \"TechnicalDescription\": \"Year\"\n            }\n            </pre>"
          format: int32
        Quarter:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration_courses.regis_qtr\" },\n                    { \"source\":\"SWSSDB.transcript_courses_taken.tran_qtr\" },\n                    { \"source\":\"UWEO.selSWSRegistrations.Quarter\"},\n                    { \"source\":\"SDB.SWI202.trm.qtr\" }\n                ],\n                \"TechnicalDescription\": \"Quarter\"\n            }\n            </pre>"
        CurriculumAbbreviation:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.sect.dept\" }\n                ],\n                \"TechnicalDescription\": \"Curriculum abbreviation\"\n            }\n            </pre>"
        CourseNumber:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.sect.crsn\" }\n                ],\n                \"TechnicalDescription\": \"Course number\"\n            }\n            </pre>"
        SectionID:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.sect.csid\" },\n                    { \"source\":\"UWEO.selSWSCourseSections.SectionID\"}\n                ],\n                \"TechnicalDescription\": \"Section ID\"\n            }\n            </pre>"
        SLN:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SDB.SWI202.sect.sln\" },\n                    { \"source\":\"UWEO.selSWSCourseSections.SLN\"}\n                ],\n                \"TechnicalDescription\": \"SLN\"\n            }\n            </pre>"
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Section Resource URI\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Section\"}],\n    \"TargetOperationId\" : [\"GetSection\"]\n}"
    EnrollmentSearchResourceUri:
      type: object
      properties:
        RegID:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"IRWS.identity.regid\" }\n                ],\n                \"TechnicalDescription\": \"UW Registration ID\"\n            }\n            </pre>"
        Verbose:
          type: boolean
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"url\" }\n                ],\n                \"TechnicalDescription\": \"User supplied value for determining payload size\"\n            }\n            </pre>"
        Href:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Enrollment Search Resource URI\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Enrollment\"}],\n    \"TargetOperationId\" : [\"GetEnrollment\"]\n}"
    PersonResourceUri:
      type: object
      properties:
        Name:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"IRWS.identity.uwPersonPrefferredName\" },\n                    { \"source\":\"IRWS.identity.uwPersonRegisteredName\" }\n                ],\n                \"TechnicalDescription\": \"This field is resource specific\"\n            }\n            </pre>"
        RegID:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"IRWS.identity.regid\" }\n                ],\n                \"TechnicalDescription\": \"UW Registration ID. This field is resource specific\"\n            }\n            </pre>"
        Pronouns:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"IRWS.identity.uwPersonPronoun\" }\n                ],\n                \"TechnicalDescription\": \"\"\n            }\n            </pre>"
        Href:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Person Resource URI\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Person\"}],\n    \"TargetOperationId\" : [\"GetPerson\"]\n}"
    EnrollmentViewModel:
      type: object
      properties:
        FullName:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_major_code.major_full_nm\" }\n                ],\n                \"TechnicalDescription\": \"Major full name. If transcripts not posted, then this value is dependent on pending_major ,as it can join from student path or registration path.\"\n            }\n            </pre>"
        Person:
          $ref: '#/components/schemas/PersonResourceUri'
        Registrations:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RegistrationViewModel'
        RegID:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"url\" }\n                ],\n                \"TechnicalDescription\": \"User supplied value\"\n            }\n            </pre>"
        ClassLevel:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.transcript.class\" },\n                    { \"source\":\"SWSSDB.registration.regis_class\" },\n                    { \"source\":\"SWSSDB.student_1.class\" }\n                ],\n                \"TechnicalDescription\": \"Class level. If transcripts not posted, then this value is dependent on pending_class\"\n            }\n            </pre>"
        ClassCode:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.transcript.class\" },\n                    { \"source\":\"SWSSDB.registration.regis_class\" },\n                    { \"source\":\"SWSSDB.student_1.class\" }\n                ],\n                \"TechnicalDescription\": \"Class code. If transcripts not posted, then this value is dependent on pending_class\"\n            }\n            </pre>"
        ClassDescription:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.transcript.class\" },\n                    { \"source\":\"SWSSDB.registration.regis_class\" },\n                    { \"source\":\"SWSSDB.student_1.class\" }\n                ],\n                \"TechnicalDescription\": \"Class description. If transcripts not posted, then this value is dependent on pending_class\"\n            }\n            </pre>"
        HonorsProgram:
          type: boolean
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.transcript.honors_program\" },\n                    { \"source\":\"SWSSDB.registration.regis_hnrs_prg\" },\n                    { \"source\":\"SWSSDB.student_1.honors_program\" }\n                ],\n                \"TechnicalDescription\": \"Honors program. If transcripts not posted, then this value is dependent on pending_hnrs_prg\"\n            }\n            </pre>"
        LeaveEndQuarter:
          type: integer
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.transcript.leave_ends_qtr\" }\n                ],\n                \"TechnicalDescription\": \"Leave End Quarter. Null if transcripts not posted\"\n            }\n            </pre>"
          format: int32
        LeaveEndYear:
          type: integer
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.transcript.leave_ends_yr\" }\n                ],\n                \"TechnicalDescription\": \"Leave End Year. Null if transcripts not posted\"\n            }\n            </pre>"
          format: int32
        Majors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MajorViewModel'
        Minors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/MinorViewModel'
        EnrollmentStatus:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration.enroll_status\" },\n                    { \"source\":\"SWSSDB.transcript.enroll_status\" }\n                ],\n                \"TechnicalDescription\": \"Enrollment Status\"\n            }\n            </pre>"
        EnrollmentStatusDate:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration.reg_en_stat_dt\" },\n                    { \"source\":\"SWSSDB.transcript.tr_en_stat_dt\" },\n                    \n                ],\n                \"TechnicalDescription\": \"Enrollment Status Date\"\n            }\n            </pre>"
        CurrentRegisteredCredits:
          type:
          - number
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration.current_credits\" }\n                ],\n                \"TechnicalDescription\": \"Current Registered Credits\"\n            }\n            </pre>"
          format: double
        Metadata:
          type:
          - string
          - 'null'
        PendingClassChange:
          type: boolean
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration.pending_class\" }\n                ],\n                \"TechnicalDescription\": \"Pending class change. Null if transcripts already cutover\"\n            }\n            </pre>"
        PendingMajorChange:
          type: boolean
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration.pending_major\" }\n                ],\n                \"TechnicalDescription\": \"Pending major change. Null if transcripts already cutover\"\n            }\n            </pre>"
        PendingHonorsChange:
          type: boolean
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration.pending_hnrs_prg\" }\n                ],\n                \"TechnicalDescription\": \"Pending honors change. Null if transcripts already cutover\"\n            }\n            </pre>"
        PendingResidentChange:
          type: boolean
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration.pending_resident\" }\n                ],\n                \"TechnicalDescription\": \"Pending resident change. Null if transcripts already cutover\"\n            }\n            </pre>"
        PendingResident:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration.resident\" }\n                ],\n                \"TechnicalDescription\": \"Pending resident. Null if transcripts already cutover\"\n            }\n            </pre>"
        PendingResidencyDescription:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration.resident\" }\n                ],\n                \"TechnicalDescription\": \"Pending residency description. Null if transcripts already cutover\"\n            }\n            </pre>"
        PendingSpecialProgramChange:
          type: boolean
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.registration.pending_sp_pgm\" }\n                ],\n                \"TechnicalDescription\": \"Pending Special Program change. Null if transcripts already cutover\"\n            }\n            </pre>"
        QtrGradePoints:
          type:
          - number
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.transcript.qtr_grade_points\"}\n                ],\n                \"TechnicalDescription\": \"Quarter Grade Points. Null if transcript not posted\"\n            }\n            </pre>"
          format: double
        QtrGradedAttmp:
          type:
          - number
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.transcript.qtr_graded_attmp\"}\n                ],\n                \"TechnicalDescription\": \"Quarter Graded Attmp. Null if transcript not posted\"\n            }\n            </pre>"
          format: double
        QtrNonGrdEarned:
          type:
          - number
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.transcript.qtr_nongrd_earned\"}\n                ],\n                \"TechnicalDescription\": \"Quarter Non Grd Earned. Null if transcript not posted\"\n            }\n            </pre>"
          format: double
        Term:
          $ref: '#/components/schemas/TermResourceUri'
        RepositoryTimeStamp:
          type:
          - string
          - 'null'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Enrollment Model\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Enrollment\"}]\n}"
    EnrollmentViewModelBase:
      type: object
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Enrollment Model\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Enrollment\"}],\n    \"RuntimeTypes\" : [\"EnrollmentViewModel\"]\n}"
    EnrollmentSearchFullViewModel:
      type: object
      properties:
        TotalCount:
          type: integer
          format: int32
        PageSize:
          type:
          - string
          - 'null'
        PageStart:
          type:
          - string
          - 'null'
        Enrollments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EnrollmentViewModelBase'
          readOnly: true
        Current:
          $ref: '#/components/schemas/EnrollmentSearchResourceUri'
        Next:
          $ref: '#/components/schemas/EnrollmentSearchResourceUri'
        Previous:
          $ref: '#/components/schemas/EnrollmentSearchResourceUri'
      additionalProperties: false
      description: "{\n    \"DisplayTitle\" : \"Enrollment Search Model\",\n    \"TargetSchema\" : [{\"target\" : \"SWS.Enrollment\"}]\n}"
    MinorViewModel:
      type: object
      properties:
        Abbreviation:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_major_code.major_abbr\" }\n                ],\n                \"TechnicalDescription\": \"Abbreviation\"\n            }\n            </pre>"
        CampusName:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sys_tbl_25_campus.branch_name\" }\n                ],\n                \"TechnicalDescription\": \"Campus name\"\n            }\n            </pre>"
        FullName:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_major_code.major_full_nm\" }\n                ],\n                \"TechnicalDescription\": \"Minor full name\"\n            }\n            </pre>"
        Name:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_major_code.major_name\" }\n                ],\n                \"TechnicalDescription\": \"Minor name\"\n            }\n            </pre>"
        Pathway:
          type: integer
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.transcript_tran_minor_group.tran_minor_path\" },\n                    { \"source\":\"SWSSDB.student_1_minor_group.minor_pathway\"}\n                ],\n                \"TechnicalDescription\": \"Minor pathway\"\n            }\n            </pre>"
          format: int32
        ShortName:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_major_code.major_short_nm\" }\n                ],\n                \"TechnicalDescription\": \"Minor short name\"\n            }\n            </pre>"
        DepartmentCode:
          type:
          - string
          - 'null'
          description: "<pre>\n            {\n                \"OriginatingSchema\" : [\n                    { \"source\":\"SWSSDB.sr_dept_code.dept_code\" }\n                ],\n                \"TechnicalDescription\": \"Department Code\"\n            }\n            </pre>"
        DepartmentAbbreviation:
          type:
