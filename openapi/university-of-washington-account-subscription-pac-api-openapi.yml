openapi: 3.2.0
info:
  title: Identity Registration Web Service REST API V3…
  description: 'This is the specification for Identity Registration Web Service REST API V3. See the supplementary API documentation at https://wiki.cac.washington.edu/x/jI8qBQ for header/querystring paramemters, payload attributes, function descriptions and example code not included here. Note: The -type and -pretty querystring parameters are described here for GET requests as they make testing much easier.'
  version: '3'
servers:
- url: https://mango.u.washington.edu:646/registry/v3
tags:
- name: account.subscription.pac
paths:
  /account.subscription.pac/{uwnetid}/{subscription_code}:
    post:
      tags:
      - account.subscription.pac
      summary: Generate subscription record PAC
      description: The account.subscription.pac resource allows you to generate a PAC for a subscription record.
      parameters:
      - name: uwnetid
        in: path
        description: UW Network identifier
        required: true
        schema:
          type: string
          format: string
      - name: subscription_code
        in: path
        description: Subscription Code number
        required: true
        schema:
          type: string
          format: string
      responses:
        '200':
          description: Message confirming PAC creation. Includes PAC and expiration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSubscriptionPacPostResult'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
      operationId: postAccountSubscriptionPacByUwnetidBySubscriptionCode
      x-operation-id-source: derived
    delete:
      tags:
      - account.subscription.pac
      summary: Delete subscription record PAC
      description: The account.subscription.pac resource allows you to remove a PAC from a subscription record.
      parameters:
      - name: uwnetid
        in: path
        description: UW Network identifier
        required: true
        schema:
          type: string
          format: string
      - name: subscription_code
        in: path
        description: Subscription Code Number
        required: true
        schema:
          type: string
          format: string
      responses:
        '200':
          description: Subscription resource operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSubscriptionPacDeleteResult'
        '400':
          description: Invalid identifier type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '404':
          description: Identifier did not match any records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '406':
          description: Content type not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
      operationId: deleteAccountSubscriptionPacByUwnetidBySubscriptionCode
      x-operation-id-source: derived
components:
  schemas:
    AccountSubscriptionPacDeleteResult:
      type: object
      properties:
        account.subscription.pac:
          type: array
          description: Response to DELETE
          items:
            type: object
            properties:
              message:
                type: string
                description: Response message (usually 'pac set')
    AccountSubscriptionPacPostResult:
      type: object
      properties:
        account.subscription.pac:
          type: array
          description: Response to POST
          items:
            type: object
            properties:
              pac:
                type: string
                description: generated PAC
              expiration:
                type: string
                description: Expiration date of PAC YYYY-MM-DD hh:mm:ss
              message:
                type: string
                description: Result of operation (usually 'pac set')
        totalcount:
          type: string
          description: Number of account.subscription.pac objects returned
    GenericError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
